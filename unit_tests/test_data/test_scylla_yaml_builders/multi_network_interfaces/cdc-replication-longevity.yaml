test_duration: 900

user_prefix: 'cdc-replication-longevity'
db_type: mixed_scylla

n_db_nodes: 3
instance_type_db: 'i4i.large'

n_test_oracle_db_nodes: 1
instance_type_db_oracle: 'i8g.large'

n_loaders: 1
instance_type_loader: 'c6i.large'


nemesis:
  runners:
    - CategoricalMonkey:
        dist:
          DecommissionMonkey: 5
          NodeTerminateAndReplace: 5
          GrowShrinkClusterNemesis: 5
          TerminateAndRemoveNodeMonkey: 5
          DecommissionStreamingErrMonkey: 5
          RandomInterruptionNetworkMonkey: 4
          # BlockNetworkMonkey: 2  # disabled due to #2745
          # StopStartInterfacesNetworkMonkey: 2  # as above
          StopWaitStartMonkey: 1
          StopStartMonkey: 1
          RestartThenRepairNodeMonkey: 1
          HardRebootNodeMonkey: 1
          MultipleHardRebootNodeMonkey: 1
          SoftRebootNodeMonkey: 1
          NodeRestartWithResharding: 1
          CorruptThenRepairMonkey: 1
          CorruptThenRebuildMonkey: 1
          DrainerMonkey: 1
          ScyllaKillMonkey: 1
          NoCorruptRepairMonkey: 1
          MajorCompactionMonkey: 1
          RefreshMonkey: 1
          EnospcMonkey: 1
          TruncateMonkey: 1
          TruncateLargeParititionMonkey: 1
          AbortRepairMonkey: 1
          SnapshotOperations: 1
          RebuildStreamingErrMonkey: 1
          RepairStreamingErrMonkey: 1
          MemoryStressMonkey: 1
        default_weight: 0

gemini_cmd: |
  --duration 30m
  --concurrency 4
  --mode write
  --cql-features basic
  --max-mutation-retries 100
  --max-mutation-retries-backoff 100ms
  --test-host-selection-policy token-aware

gemini_table_options:
  - "cdc={'enabled':true,'ttl':0}"

scylla_network_config:
- address: listen_address  # Address Scylla listens for connections from other nodes. See storage_port and ssl_storage_ports.
  ip_type: ipv4
  public: false
  listen_all: true  # Should be True when multiple interfaces - Scylla should be listening on all interfaces
  use_dns: false
  nic: 1
- address: rpc_address  # Address on which Scylla is going to expect Thrift and CQL client connections.
  ip_type: ipv4
  public: false
  listen_all: true  # Should be True when multiple interfaces - Scylla should be listening on all interfaces
  use_dns: false
  nic: 1
- address: broadcast_rpc_address  # Address that is broadcasted to tell the clients to connect to. Related to rpc_address.
  ip_type: ipv4
  public: false  # Should be False when multiple interfaces
  use_dns: false
  nic: 1
- address: broadcast_address  # Address that is broadcasted to tell other Scylla nodes to connect to. Related to listen_address above.
  ip_type: ipv4
  public: false  # Should be False when multiple interfaces
  use_dns: false
  nic: 1  #  If ipv4 and public is True it has to be primary network interface (device index is 0)
- address: test_communication  # Type of IP used to connect to machine instances
  ip_type: ipv4
  public: false
  use_dns: false
  nic: 0  #  If ipv4 and public is True it has to be primary network interface (device index is 0)
