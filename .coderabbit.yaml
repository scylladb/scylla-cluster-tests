language: "en-US"

# The review rules live in REVIEW.md and docs/standards/ (read through
# knowledge_base.code_guidelines). Do not restate them here.
# Design: docs/plans/ai-tooling/review-tools/spec.md

reviews:
  profile: quiet
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  auto_review:
    enabled: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "[Backport"
    labels:
      - "!skip-review"
  path_filters:
    - "!argus/**"
  request_changes_workflow: false
  collapse_walkthrough: true
  poem: false
  review_status: false
  sequence_diagrams: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  # Off: pre-commit runs ruff (which covers pylint and flake8) and check-yaml.
  # markdownlint and languagetool flag style, which REVIEW.md does not check.
  # shellcheck, actionlint, hadolint, and gitleaks stay on: nothing else runs them.
  tools:
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false
  # Generated code and title/description checks are outside the REVIEW.md passes.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
  labeling_instructions:
    - label: "Bug"
      instructions: "Apply when the PR fixes a bug (not adding features or refactoring)"
    - label: "Performance"
      instructions: "Apply when the PR modifies performance test logic, stress tool wrappers, or benchmarking code"
    - label: "Infrastructure"
      instructions: "Apply when the PR modifies cloud provisioning code in sdcm/provision/, cluster backend files, or SCT runner infrastructure"
    - label: "scylla-operator"
      instructions: "Apply when the PR modifies files under sdcm/cluster_k8s/ or functional_tests/"
    - label: "docker-backend"
      instructions: "Apply when the PR modifies sdcm/cluster_docker.py or docker-specific configurations"
    - label: "GCE"
      instructions: "Apply when the PR modifies sdcm/cluster_gce.py or GCE-specific provisioning"
    - label: "cloud/azure"
      instructions: "Apply when the PR modifies sdcm/cluster_azure.py or Azure-specific provisioning"
    - label: "monitor"
      instructions: "Apply when the PR modifies sdcm/monitorstack/, prometheus.py, or Grafana-related code"
    - label: "dependencies"
      instructions: "Apply when the PR modifies pyproject.toml dependencies"
chat:
  auto_reply: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: "enabled"
    project_keys:
      - "SCT"
      - "SCYLLADB"
      - "QATOOLS"
  linear:
    team_keys: []
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "REVIEW.md"
      - "docs/standards/**/*.md"
      - "skills/code-review/SKILL.md"

tone_instructions: "Be extremely concise. No pleasantries, no summaries, no follow-up suggestions. Only report actionable issues found in the code."
