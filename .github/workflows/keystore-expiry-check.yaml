name: Keystore credential expiry check
# Weekly watch over the SCT keystore so a credential never lapses unnoticed
# again (SCT-1042: the Azure service principal secret expired and every Azure
# run, including cloud cleanup, failed at its first API call).
#
# Reads the `expires_on` tag from each `sct/*` secret in AWS Secrets Manager,
# then asks Azure AD directly for the real expiry of the service principal
# secret and reports any disagreement. The Azure lookup needs no extra
# permission - an application may always read its own application object.
# The tag is set during rotation - see docs/keystore-credential-rotation.md.
#
# Local testing (requires AWS credentials for account 797456418907):
#   pip install boto3
#   python .github/scripts/check_keystore_expiry.py --warn-days 30

permissions: {}

on:
  schedule:
    # Mondays 06:00 UTC, so a warning lands at the start of the work week
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Days before expiry at which to start warning'
        required: false
        default: '30'
      skip_azure:
        description: 'Skip the live Azure AD lookup and trust the tag instead'
        type: boolean
        required: false
        default: false

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    # run only on the main repository, won't work on forks
    if: github.repository == 'scylladb/scylla-cluster-tests'
    permissions:
      issues: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.QA_USER_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.QA_USER_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Check credential expiry
        id: check
        # Keep going so the issue still gets filed when something is expired;
        # the final step re-raises the failure.
        continue-on-error: true
        run: |
          python .github/scripts/check_keystore_expiry.py \
            --warn-days "${{ github.event.inputs.warn_days || '30' }}" \
            ${{ github.event.inputs.skip_azure == 'true' && '--no-azure' || '' }}

      - name: Open or update tracking issue
        if: steps.check.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -euo pipefail
          title="SCT keystore credentials need rotation"
          body=$(printf '%s\n\n---\n\nRaised by [%s](%s/%s/actions/runs/%s). This issue is updated weekly and closed automatically once every credential is healthy.\n' \
            "$REPORT" "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still needs attention as of $(date -u +%Y-%m-%d)."
            echo "Updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close tracking issue when all clear
        if: steps.check.outputs.needs_attention == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="SCT keystore credentials need rotation"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "All keystore credentials are healthy as of $(date -u +%Y-%m-%d)."
            echo "Closed issue #$existing"
          fi

      - name: Fail when a credential is already expired
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::At least one SCT keystore credential has expired - see the job summary."
          exit 1
