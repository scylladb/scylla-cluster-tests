name: Test Hydra on MacOS

# Runs the PR's own hydra.sh on macOS. It uses no credentials, so it runs on `pull_request`
# (fork PRs included) with a read-only token and no secrets, and only commands sct.py runs
# without AWS / Okta / the keystore (see the list in sct.py's `cli()`).
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  test:
    if: github.event.label.name == 'test-macos'
    runs-on: macos-26-intel
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Docker
      uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1.1.0
    - name: Run Hydra
      run: bash -x ./docker/env/hydra.sh nemesis-list
