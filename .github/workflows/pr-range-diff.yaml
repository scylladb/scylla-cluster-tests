# Post the git range-diff of each force-push to a pull request as a comment,
# so a reviewer sees what changed since the previous push.
# Port of .github/workflows/pr-range-diff.yaml in scylladb/scylladb (b97a8e03965e).
# Design: docs/plans/ai-tooling/push-to-push-diffs/spec.md
#
# pr-range-diff-record.yaml runs on each push to a pull request, with no token,
# and uploads the PR number. This workflow runs on workflow_run from master.
# It trusts only the PR number from that run, and takes the old head and the
# new head from the force-push event of the PR on GitHub.
name: Post range-diff on PR force-push

on:
  workflow_run:
    workflows: ['Record PR push for range-diff']
    types: [completed]

permissions: {}

jobs:
  range-diff:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Find the force-push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          NEW_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" --name pr-push --dir pr-push
          # The recorder runs the workflow file of the pull request, so its
          # artifact is untrusted: accept a number and nothing else.
          pr=$(head -c 20 pr-push/number | tr -d '\n')
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::PR number '$pr' is not a number"; exit 1; }
          base_ref=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .base.ref)
          # A push that only appends commits has no force-push event, and gets no
          # comment. A new head that the PR never had matches no event either.
          old_head=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F number="$pr" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                timelineItems(last: 100, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) { nodes {
                  ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } } } } } }' |
            jq -r --arg new "$NEW_HEAD" '[.data.repository.pullRequest.timelineItems.nodes[]
              | select(.afterCommit.oid == $new and .beforeCommit != null)] | last | .beforeCommit.oid // empty')
          {
            echo "pr=$pr"
            echo "base_ref=$base_ref"
            echo "old_head=$old_head"
          } >> "$GITHUB_OUTPUT"

      # No checkout of the PR's code: only git objects are fetched and compared,
      # nothing from the PR is executed.
      - name: Fetch old and new heads
        if: steps.push.outputs.old_head != ''
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ steps.push.outputs.base_ref }}
          OLD_HEAD: ${{ steps.push.outputs.old_head }}
          NEW_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          git init -q repo && cd repo
          git remote add origin "$REPO_URL"
          # The base is the tip of the base branch: each series starts at its
          # merge-base with it, whichever commit of the branch the author rebased on.
          # Blobless fetch keeps it cheap; range-diff fetches the blobs it needs lazily.
          git fetch -q --filter=blob:none origin "$OLD_HEAD" "$NEW_HEAD" "+refs/heads/$BASE_REF:refs/base"

      - name: Compute range-diff
        if: steps.push.outputs.old_head != ''
        working-directory: repo
        env:
          OLD_HEAD: ${{ steps.push.outputs.old_head }}
          NEW_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          old_base=$(git merge-base refs/base "$OLD_HEAD")
          new_base=$(git merge-base refs/base "$NEW_HEAD")
          # Hunk headers name the Python function or class of each change.
          echo '*.py diff=python' > .git/info/attributes
          # A creation factor of 80 pairs a small commit with its fixed version,
          # so the comment shows the diff of the fix.
          git range-diff --no-color --creation-factor=80 "$old_base..$OLD_HEAD" "$new_base..$NEW_HEAD" | tee ../range-diff.txt

      - name: Format comment
        if: steps.push.outputs.old_head != ''
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OLD_HEAD: ${{ steps.push.outputs.old_head }}
          NEW_HEAD: ${{ github.event.workflow_run.head_sha }}
        shell: python
        run: |
          import html, os, re

          # Commit pair lines look like "1:  abc1234 ! 1:  def5678 title", with
          # the numbers padded to a common width; everything else is the diff of
          # the pair above, indented by four spaces, so a line quoted in it (say,
          # from a commit message) can't pass for a pair line.
          pair = re.compile(r"^ {0,3}(-|\d+):\s+(-+|[0-9a-f]+) ([<>=!])\s+(-|\d+):\s+(-+|[0-9a-f]+) (.*)$")
          commits = []
          for line in open("range-diff.txt").read().splitlines():
              m = pair.match(line)
              if m:
                  dropped = m[3] == "<"
                  commits.append({"pos": m[1] if dropped else m[4], "sha": m[2] if dropped else m[5],
                                  "status": m[3], "title": m[6], "diff": []})
              elif commits:
                  # Dropping the indent puts the outer +/- in the first column,
                  # where GitHub's diff highlighting looks for it.
                  commits[-1]["diff"].append(line[4:])

          # Commit titles come from the PR author: escape Markdown so they can't
          # inject links or images, and break @ so they can't mention anyone.
          def md(s):
              return re.sub(r"([\\`*_\[\]()<>#!|~])", r"\\\1", s).replace("@", "@​")

          # A fence longer than any backtick run in the diff can't be closed by it.
          def fence(lines):
              return "`" * max([3] + [len(r) + 1 for l in lines for r in re.findall(r"`+", l)])

          label = {"!": "**modified**", ">": "**new**", "<": "**dropped**"}
          total = sum(c["status"] != "<" for c in commits)
          repo, old, new = os.environ["REPO_URL"], os.environ["OLD_HEAD"], os.environ["NEW_HEAD"]
          out = [f"### Changes since previous version ([`{old[:10]}`]({repo}/commit/{old}) → [`{new[:10]}`]({repo}/commit/{new}))", ""]
          # Each block is (head, body, tail); only a section has a body, which
          # is what gets cut if the comment runs out of room.
          blocks = []
          # Only the commits that changed are listed; their positions still
          # tell where they are in the series.
          for c in commits:
              if c["status"] == "=":
                  continue
              pos = f"{c['pos']}/{total}" if c["status"] != "<" else "–"
              blocks.append(([f"- `{pos}` {label[c['status']]}: [{md(c['title'])}]({repo}/commit/{c['sha']})"], [], []))
          if not blocks:
              blocks.append((["Rebased only; no commit changed."], [], []))
          blocks.append(([""], [], []))

          for c in commits:
              if c["status"] != "!":
                  continue
              # Code lines of the patch added or removed between the two versions,
              # not counting the context lines that come and go with a hunk.
              changed = sum(l[:2] in ("++", "+-", "-+", "--") for l in c["diff"])
              title = html.escape(c["title"]).replace("@", "@​").replace("#", "#​")
              f = fence(c["diff"])
              # Collapsed, so the comment stays short however much changed;
              # the heading says how much is inside.
              blocks.append(([f"<details><summary><b>{c['pos']}/{total} {title}</b> ({changed} lines changed)</summary>", "", f + "diff"],
                             c["diff"], [f, "</details>", ""]))

          def size(lines):
              return sum(len(l.encode()) + 1 for l in lines)

          # Render up to limit bytes, keeping room for the notice. The block that
          # doesn't fit is cut: a section keeps as much of its diff as fits and
          # still closes its fence and <details>, a list entry is dropped.
          def render(limit, notice):
              lines, room = list(out), limit - size(out) - size([notice])
              for head, body, tail in blocks:
                  if size(head + body + tail) <= room:
                      lines += head + body + tail
                      room -= size(head + body + tail)
                      continue
                  room -= size(head + tail)
                  if body and room > 0:
                      kept = []
                      for l in body:
                          room -= len(l.encode()) + 1
                          if room < 0:
                              break
                          kept.append(l)
                      lines += head + kept + tail
                  lines.append(notice)
                  break
              return "\n".join(lines) + "\n"

          # A comment is capped at 65536 characters. If the range-diff doesn't fit
          # in one, the comment is cut and links to the job summary, which is
          # capped at 1 MiB and gets all of it; the workflow log has it anyway.
          full = render(1000000, "_Truncated; the full range-diff is in the workflow log._")
          if len(full.encode()) <= 60000:
              comment = full
          else:
              run = os.environ["RUN_URL"]
              comment = render(60000, f"_Truncated; the full range-diff is in the [job summary]({run})._")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(full)
          open("comment.md", "w").write(comment)

      - name: Post comment
        if: steps.push.outputs.old_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.push.outputs.pr }}
        run: gh pr comment "$PR" --body-file comment.md
