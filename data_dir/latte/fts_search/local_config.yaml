# Tiny FTS plan for local correctness runs on the docker backend.
#
# Used by test-cases/fts-search/fts-search-test-docker.yaml. Deliberately small:
# the goal is to exercise every branch of FtsSearchTest.test_fts_search, not to
# produce meaningful performance numbers.
#
# No `base_url` -> every shard/query file is read from
# data_dir/latte/fts_search/<dataset name>/ and no S3 access happens. The corpora are generated,
# not tracked in git, and the run leaves them in place, so this is a one-off after a fresh clone:
#   python3 data_dir/latte/fts_search/generate_local_dataset.py
datasets:
  - name: local_tiny
    max_index_wait_secs: 300
    defaults:
      limit: 5
      stress_options: {concurrency: 2}
      rate: 0
      duration: 10s
      expected_p99_read_ms: 10
    steps:
      # Single shard: simplest load path, one rate-limited query. Both steps put their build in
      # one Argus track, and each puts a query in another, so a local run exercises the track
      # tables next to the logs -- see docs/fts-search-test.md "Results in Argus".
      - shards: [0]
        build_track: indexing
        build_label: local_tiny 1 shard
        queries:
          - set: term_common
            stress_options: {concurrency: 1, warmup: 20}
            rate: 50
            track: term latency
            label: local_tiny 1 shard
      # Shard range: exercises _parse_shard_spec, cumulative doc counts and the
      # _drop_index of the previous step's index.
      - shards: [1..2]
        build_track: indexing
        build_label: local_tiny 3 shards
        queries:
          - set: term_common
            track: throughput
            label: local_tiny 3 shards term_common
          # Deliberate duplicate of the entry above: both are recorded, told apart by
          # their 'query_index'.
          - set: term_common
          - set: natural
            expected_p99_read_ms: 50

  # Second dataset: exercises the multi-dataset loop in test_fts_search
  # (drop table + recreate schema per dataset). No `shards` key, so
  # _load_step_shards takes the step["documents_file"] branch instead.
  # qrels: true exercises qrels staging and the accuracy metrics.
  - name: local_smoke
    max_index_wait_secs: 300
    defaults:
      limit: 5
      stress_options: {concurrency: 2}
      rate: 0
      duration: 10s
      expected_p99_read_ms: 50
    steps:
      - documents_file: documents.tsv
        queries:
          - set: natural
            qrels: true
      # A rebuild on the same corpus (an empty 'shards' list, so _load_step_shards is a
      # no-op, and no `queries`), exercising the "index build without a load or a
      # search phase" path -- see docs/fts-search-test.md "Repeated builds on the same
      # data".
      - shards: []
      # Another no-load rebuild, this one repeating the first step's query set. Since
      # nothing was loaded in between, all three steps report the same document count,
      # so only 'step' tells this record apart from the first step's.
      - shards: []
        queries:
          - set: natural
