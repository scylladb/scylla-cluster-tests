datasets:
  - name: 10M_20tok
    base_url: s3://full-text-search-sct/fts/10M_20tok
    max_index_wait_secs: 1800
    defaults:
      limit: 5
      # latte flags. 200 warmup queries cover a set of about 30, which a run repeats, so their first
      # use is not measured cold. 'natural' draws ~1,500 of ~510k queries, so it runs cold by design
      # and its entries turn the warmup off.
      stress_options: {concurrency: 32, warmup: 200}
      rate: 0
      duration: 30s
      expected_p99_read_ms: 10
    steps:
      - shards: [0]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
      - shards: [1..9]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
      - shards: [10..99]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
          - set: term_common
            limit: 100
          - set: term_medium
          - set: term_rare
          - set: boolean_and
            expected_p99_read_ms: 50
          - set: boolean_or
            expected_p99_read_ms: 50
          - set: boolean_not
            expected_p99_read_ms: 50
          - set: phrase
            expected_p99_read_ms: 50
          - set: natural
            stress_options: {warmup: false}
            expected_p99_read_ms: 50
  - name: 10M_400tok
    base_url: s3://full-text-search-sct/fts/10M_400tok
    max_index_wait_secs: 1800
    defaults:
      limit: 5
      # latte flags, see 10M_20tok above.
      stress_options: {concurrency: 64, warmup: 200}
      rate: 0
      duration: 30s
      expected_p99_read_ms: 10
    steps:
      - shards: [0]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
      - shards: [1..9]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
      - shards: [10..99]
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
          - set: term_common
          - set: term_common
            limit: 100
          - set: term_medium
          - set: term_rare
          - set: boolean_and
            expected_p99_read_ms: 50
          - set: boolean_or
            expected_p99_read_ms: 50
          - set: boolean_not
            expected_p99_read_ms: 50
          - set: phrase
            expected_p99_read_ms: 50
          - set: natural
            stress_options: {warmup: false}
            expected_p99_read_ms: 50
