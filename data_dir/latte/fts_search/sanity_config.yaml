# Default FTS plan: a sanity run on real data.
#
# Used by test-cases/fts-search/fts-search-test.yaml. Small on purpose -- it answers "does the
# whole pipeline work end to end against a real corpus?", not "how fast is BM25?". Use
# large_config.yaml (or a plan on S3, see below) for actual performance numbers.
#
# The corpus still comes from S3: `base_url` points at the same 10M-document dataset the full
# plan uses, this plan just loads 5 of its 100 shards. Two load steps rather than one so the
# rebuild-on-a-bigger-corpus path (drop index -> load more shards -> rebuild) is covered too, each
# followed by two no-load rebuilds on the same corpus to sample index-build-time variance in
# isolation from load time (see docs/fts-search-test.md "Repeated builds on the same data").
#
# To run a different plan without touching this file, point `search_test_config` at it -- a path
# relative to the SCT root, and a full S3 URL is downloaded into this directory:
#   SCT_SEARCH_TEST_CONFIG=data_dir/latte/fts_search/large_config.yaml
#   SCT_SEARCH_TEST_CONFIG=s3://full-text-search-sct/fts/config/my_plan.yaml
datasets:
  - name: 10M_20tok
    base_url: s3://full-text-search-sct/fts/10M_20tok
    max_index_wait_secs: 1800
    defaults:
      limit: 5
      # latte flags. 200 warmup queries cover a set of about 30, which a run repeats, so their first
      # use is not measured cold. 'natural' draws ~1,500 of ~510k queries, so it runs cold by design
      # and its entries turn the warmup off.
      stress_options: {concurrency: 32, warmup: 200}
      rate: 0
      duration: 30s
      expected_p99_read_ms: 10
    steps:
      # Every entry is tracked in Argus, under the names large_config.yaml uses for the same
      # measurement, so a series continues whichever of the two plans ran -- see
      # docs/fts-search-test.md "Results in Argus".
      #
      # ~100k documents, then two rebuilds over them; after the last, one rate-limited query for
      # latency and one unthrottled for throughput.
      - shards: [0]
        build_track: indexing
        build_label: 10M_20tok 100k
      - shards: []
        build_track: indexing
        build_label: 10M_20tok 100k rebuild 1
      - shards: []
        build_track: indexing
        build_label: 10M_20tok 100k rebuild 2
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
            track: term latency
            label: 10M_20tok 100k
          - set: term_common
            track: throughput
            label: 10M_20tok 100k term_common
      # ~500k documents, on top of the shard above.
      - shards: [1..4]
        build_track: indexing
        build_label: 10M_20tok 500k
        queries:
          - set: term_common
            stress_options: {concurrency: 1}
            rate: 50
            track: term latency
            label: 10M_20tok 500k
          - set: term_common
            track: throughput
            label: 10M_20tok 500k term_common
          # A compound query set as well, rate-limited in a track of its own, as its P99 limit differs.
          - set: natural
            stress_options: {concurrency: 1, warmup: false}
            rate: 50
            expected_p99_read_ms: 50
            track: compound query latency
            label: 10M_20tok 500k natural
          - set: natural
            stress_options: {warmup: false}
            expected_p99_read_ms: 50
            track: throughput
            label: 10M_20tok 500k natural
      # Warm rebuilds on the same ~500k-document corpus: an empty 'shards' list makes
      # _load_step_shards a no-op, so each of these is only an index build.
      - shards: []
        build_track: indexing
        build_label: 10M_20tok 500k rebuild 1
      - shards: []
        build_track: indexing
        build_label: 10M_20tok 500k rebuild 2
