test_metadata:
  description: >-
    Artifacts validation test for the official ScyllaDB Azure x86_64 image: provisions a single
    Standard_L8s_v3 node from the published Scylla machine image and runs the artifact smoke
    checks. Node addresses are made public because the test drives the Azure VM from an AWS runner.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - azure
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

cluster_backend: 'azure'
azure_region_name: "eastus"
use_preinstalled_scylla: true
backtrace_decoding: false
sizing_db:
  vcpu: 8
  memory: '>=64'
  local_disk_gb: '>=1500'  # ~80% of Standard_L8s_v3's 1920GB
#root_disk_size_db: 50
instance_provision: "spot"
instance_provision_fallback_on_demand: false  # todo lukasz: add support for fallback on demand for azure
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
test_duration: 60
user_prefix: 'artifacts-azure-image'

# since running from runner in AWS, we need the address to be publicly available
intra_node_comm_public: true
