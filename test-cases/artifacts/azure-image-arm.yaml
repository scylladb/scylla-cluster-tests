cluster_backend: 'azure'
azure_region_name: "eastus"
use_preinstalled_scylla: true
backtrace_decoding: false
sizing_db:
  vcpu: 4
  memory: '>=16'
  # Azure's cloud default arch is x86_64 (see sizing_config.yaml); pin arm64 so the
  # resolver stays on an ARM instance instead of silently picking an x86 one, which
  # would defeat the purpose of this ARM-specific artifact test.
  arch: arm64
instance_provision: "spot"
instance_provision_fallback_on_demand: true
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
test_duration: 60
user_prefix: 'artifacts-azure-image-arm'

# since running from runner in AWS, we need the address to be publicly available
intra_node_comm_public: true
