test_metadata:
  description: >-
    Artifacts validation test that installs ScyllaDB from the RPM repository onto a stock Amazon Linux
    2023 AMI and runs the standard artifact smoke checks. Backs the artifacts-amazon2023 pipelines in
    both flavours - repository install and offline (nonroot) install - plus the arm64 variant on
    Graviton instances.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

ami_db_scylla_user: 'ec2-user'
ami_id_db_scylla: 'resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
root_disk_size_db: 50
backtrace_decoding: false
cluster_backend: 'aws'
sizing_db:
  vcpu: 2
  memory: '>=16'
  arch: x86_64
instance_provision: "spot"
instance_provision_fallback_on_demand: true
logs_transport: 'ssh'
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
scylla_linux_distro: 'centos'
test_duration: 60
use_preinstalled_scylla: false
user_prefix: 'artifacts-al2023'
fallback_to_next_availability_zone: true

user_credentials_path: '~/.ssh/scylla_test_id_ed25519'
