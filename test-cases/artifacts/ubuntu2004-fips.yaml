test_metadata:
  description: >-
    Artifacts validation test for the FIPS-enabled Ubuntu 20.04 marketplace AMI: installs ScyllaDB
    from the Debian repository, asserts the expected FIPS linux-distro features and brings the node up
    with server, client and internode encryption enabled. The only artifact job that exercises the
    FIPS crypto path.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  features:
    - tls-ssl
  team_ownership: core-test-infra

ami_id_db_scylla: 'resolve:ssm:/aws/service/marketplace/prod-k6fgbnayirmrc/latest' # Ubuntu Pro FIPS 20.04 LTS amd64
assert_linux_distro_features: ['fips']
root_disk_size_db: 50
backtrace_decoding: false
cluster_backend: 'aws'
sizing_db:
  vcpu: 2
  memory: '>=16'
  arch: x86_64
instance_provision: "spot"
instance_provision_fallback_on_demand: true
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
region_name: 'us-east-1'
scylla_linux_distro: 'ubuntu-focal'
use_preinstalled_scylla: false
ami_db_scylla_user: 'ubuntu'
client_encrypt: true
server_encrypt: true
internode_encryption: 'all'
test_duration: 60
user_prefix: 'artifacts-ubuntu2004-fips'
fallback_to_next_availability_zone: true
