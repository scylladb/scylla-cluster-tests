test_metadata:
  description: >-
    Artifacts validation test for the official ScyllaDB OCI image: provisions a single
    VM.DenseIO.E5.Flex node in us-phoenix-1 from the published image and runs the artifact smoke
    checks. On-demand provisioning only, since DenseIO shapes cannot be spot.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - oci
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

cluster_backend: "oci"
oci_region_name: "us-phoenix-1"
use_preinstalled_scylla: true
backtrace_decoding: false

sizing_db:
  vcpu: 16
  memory: '>=96'

# NOTE: DenseIO instance shapes are not allowed to be "spot"
instance_provision: "on_demand"

instance_provision_fallback_on_demand: true
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
test_duration: 60
user_prefix: 'artifacts-oci-image'
