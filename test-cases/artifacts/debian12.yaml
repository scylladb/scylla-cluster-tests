test_metadata:
  description: >-
    Artifacts validation test that installs ScyllaDB from the Debian repository onto a stock Debian 12
    (bookworm) GCE image and runs the standard artifact smoke checks. Covers both the repository
    install and the offline/nonroot install pipelines.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - gce
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

backtrace_decoding: false
cluster_backend: 'gce'
gce_image_db: 'https://www.googleapis.com/compute/v1/projects/debian-cloud/global/images/family/debian-12'
sizing_db:
  vcpu: 2
  memory: '>=8'
gce_root_disk_type_db: 'pd-ssd'
root_disk_size_db: 50
gce_n_local_ssd_disk_db: 1
instance_provision: "spot"
instance_provision_fallback_on_demand: true
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
scylla_linux_distro: 'debian-bookworm'
test_duration: 60
user_prefix: 'artifacts-debian12'
use_preinstalled_scylla: false
fallback_to_next_availability_zone: true
