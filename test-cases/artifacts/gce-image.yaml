test_metadata:
  description: >-
    Artifacts validation test for the official ScyllaDB GCE image on local SSD: provisions one
    n2-standard-2 node from the published image and runs the artifact smoke checks. Also used by the
    minicloud GCE-image artifact job that runs the same flow on the local QEMU/KVM cloud emulator.
  test_type: artifacts
  tier: sanity
  duration_class: short
  supported_backends:
    - gce
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

cluster_backend: 'gce'
backtrace_decoding: false
sizing_db:
  vcpu: 2
  memory: '>=8'
gce_root_disk_type_db: 'pd-ssd'
root_disk_size_db: 50
gce_n_local_ssd_disk_db: 8
instance_provision: "spot"
instance_provision_fallback_on_demand: true
n_db_nodes: 1
n_loaders: 0
n_monitor_nodes: 0
nemesis_class_name: 'NoOpMonkey'
scylla_linux_distro: 'centos'
test_duration: 60
user_prefix: 'artifacts-gce-image'
fallback_to_next_availability_zone: true
