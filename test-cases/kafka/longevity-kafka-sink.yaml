test_metadata:
  description: >-
    Kafka sink-connector test skeleton: a single-node cluster plus a localstack Kafka backend on the
    local docker network, with the actual connector and workload supplied by the job. The counterpart
    of longevity-kafka-cdc.yaml for the sink direction; no pipeline references it yet.
  test_type: longevity
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
    - docker
  stress_tools: []
  nemesis_labels:
    - NoOpMonkey
  team_ownership: core-test-infra

test_duration: 60

n_loaders: 1
n_db_nodes: 1

instance_type_runner: c7i.2xlarge
sizing_db:
  vcpu: 2
  memory: '>=16'
  arch: x86_64

nemesis_class_name: 'NoOpMonkey'
nemesis_interval: 1

user_prefix: 'kafka'
use_mgmt: false

docker_network: 'kafka-stack-docker-compose_default'

kafka_backend: 'localstack'
