test_metadata:
  description: >-
    Scylla Manager upgrade test: a 3-node cluster with client encryption is managed by an older
    Manager release, which is then upgraded to the target version while cassandra-stress write and
    read workloads run and backup/restore keeps working. Shared by the per-distro manager-upgrade
    pipelines.
  test_type: upgrade
  tier: tier1
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels: []
  team_ownership: core-test-infra

test_duration: 360

stress_cmd: "cassandra-stress write cl=QUORUM n=1200300 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -pop seq=400200300..600200300"
stress_read_cmd: "cassandra-stress read cl=QUORUM n=1200300 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -pop seq=400200300..600200300"

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 2
  memory: '>=16'
sizing_loader:
  vcpu: 2
  memory: '>=4'

region_name: 'us-east-1'
n_db_nodes: '3'
n_loaders: 1

client_encrypt: true

user_prefix: manager-upgrade
space_node_threshold: 6442
ip_ssh_connections: 'private'

manager_prometheus_port: 10091

aws_instance_profile_name_db: 'qa-scylla-manager-backup-instance-profile'
