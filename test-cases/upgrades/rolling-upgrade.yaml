test_metadata:
  description: >-
    The main rolling-upgrade test: a 6-node encrypted cluster is preloaded with cassandra-stress and
    CL=ALL scylla-bench data, then upgraded node by node while complex-schema, large-partition and
    read workloads run, with optional Gemini comparison. Backs the AMI, ARM, GCE-image, Azure-image,
    LDAP and enable-tablets rolling-upgrade pipelines.
  test_type: upgrade
  tier: tier1
  duration_class: medium
  supported_backends:
    - aws
    - azure
    - gce
  stress_tools:
    - cassandra-stress
    - scylla-bench
    - gemini
    - latte
  workload: mixed
  nemesis_labels: []
  features:
    - tls-ssl
    - large-partitions
  team_ownership: core-test-infra

test_duration: 360

# workloads
write_stress_during_entire_test: cassandra-stress write no-warmup cl=QUORUM n=20100200 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate threads=100 -pop seq=1..20100200 -log interval=5
verify_stress_after_cluster_upgrade: cassandra-stress read no-warmup cl=QUORUM n=20100200 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate threads=1000 -pop seq=1..20100200 -log interval=5
# Preload/validation workload that runs BEFORE any nodes are upgraded.
# The first command is the standard prepare write stress, the second is scylla-bench using CL=ALL
# to ensure data is correctly written on all nodes before upgrade starts.
# This guarantees we can validate data later without ambiguity about whether issues
# occurred during preload or during the test itself.
prepare_write_stress:
  - cassandra-stress write no-warmup cl=QUORUM n=10100200 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native compression=lz4 -rate threads=1000 -pop seq=1..10100200 -log interval=5
  - scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=5 -connection-count=5 -consistency-level=all -rows-per-request=10 -timeout=30s -validate-data
stress_cmd_read_cl_quorum: cassandra-stress read no-warmup cl=QUORUM n=10100200 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=DeflateCompressor' -mode cql3 native compression=none -rate threads=1000 -pop seq=1..10100200 -log interval=5
stress_cmd_read_10m: cassandra-stress read no-warmup cl=QUORUM duration=10m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=SnappyCompressor' -mode cql3 native compression=snappy -rate threads=1000 -pop seq=1..10100200 -log interval=5
stress_cmd_read_60m: cassandra-stress read no-warmup cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate threads=1000 -pop seq=1..10100200 -log interval=5
stress_cmd_complex_prepare: latte run data_dir/latte/complex_schema.rn -f insert --consistency ALL -d 5000000 -P row_count=5000000 --threads 8 --concurrency 128
stress_cmd_complex_verify_read: latte run data_dir/latte/complex_schema.rn -f read_by_key:1 -f read_by_email:1 --consistency ONE -d 5000000 -P row_count=5000000 --threads 8 --concurrency 128 --validation-strategy=retry
stress_cmd_complex_verify_more: latte run data_dir/latte/complex_schema.rn -f read_by_key:1 -f read_by_ck:1 -f read_by_email:1 -f update_static:1 -f update_ttl:1 -f update_diff1_ts:1 -f update_diff2_ts:1 -f update_same1_ts:1 -f update_same2_ts:1 --consistency ALL -d 5000000 -P row_count=5000000 --threads 8 --concurrency 64 --validation-strategy=retry
stress_cmd_complex_verify_delete: latte run data_dir/latte/complex_schema.rn -f delete_row --consistency ALL -d 500000 -P row_count=5000000 --threads 8 --concurrency 64
# Large partition workload that runs DURING rolling upgrade while nodes are being upgraded.
# Uses CL=QUORUM (NOT CL=ALL) because not all nodes may be available during upgrade.
# This tests cluster behavior with large partitions under load during the upgrade process.
large_partition_stress_during_upgrade: scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=5 -connection-count=5 -consistency-level=quorum -rows-per-request=10 -timeout=30s -validate-data -keyspace scylla_bench_during_upgrade
stress_after_cluster_upgrade: scylla-bench -workload=sequential -mode=read -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=20 -connection-count=20 -consistency-level=one -rows-per-request=100 -timeout=30s -validate-data

n_db_nodes: 6
n_loaders: 1

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 8
  memory: '>=64'
sizing_loader:
  vcpu: 8
  memory: '>=16'

user_prefix: 'rolling-upgrade'

server_encrypt: true

use_mgmt: false

gemini_cmd: |
  --duration 2h
  --concurrency 10
  --mode write
  --max-mutation-retries 5
  --max-mutation-retries-backoff 500ms
  --async-objects-stabilization-attempts 5
  --async-objects-stabilization-backoff 500ms

gemini_seed: 66

use_preinstalled_scylla: false

gemini_log_cql_statements: false

# Disable Gemini workload during rolling upgrade test
run_gemini_in_rolling_upgrade: false
