# LWT Light Predefined Throughput Steps test — 3-node cluster
#
# Workload: Light LWT operations using cs_lwt_perf_small.yaml profile
#   write  (stress_cmd_w)  — INSERT ... IF NOT EXISTS  (light: single-PK, narrow row ~76 bytes)
#   read   (stress_cmd_r)  — SELECT by primary key     (non-LWT QUORUM read baseline)
#   mixed  (stress_cmd_m)  — INSERT IF NOT EXISTS + SELECT  (50/50 mix)
#
# connectionsPerHost=1000 — targets ~1000 connections per shard per node.
# Calculation: 1000 conns/host × 7 loaders = 7000 per node ÷ 7 shards = 1000/shard (i8g.2xlarge).
#
# Used by:
#   scylla-enterprise-perf-regression-predefined-throughput-steps-lwt-light-vnodes.jenkinsfile
#   scylla-enterprise-perf-regression-predefined-throughput-steps-lwt-light-tablets.jenkinsfile

test_duration: 500

test_metadata:
  description: >-
    Gradual-throughput LWT performance comparison between tablets and vnodes on a
    3-node cluster, using light (narrow ~76-byte row) conditional INSERT/SELECT
    workloads at predefined throttled throughput steps for write, read, and mixed
    sub-tests.
  test_type: performance
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: lwt
  features:
    - tablets
    - vnodes

# Keyspace and table come from cs_lwt_perf_small.yaml profile
perf_stress_keyspace: ks
perf_stress_table: targettable

round_robin: true

n_db_nodes: 3
n_loaders: 7

instance_type_db: 'i8g.2xlarge'
instance_type_loader: 'c7i.xlarge'
instance_type_monitor: 't3.large'
use_capacity_reservation: true
use_placement_group: true
nemesis_add_node_cnt: 0

use_preinstalled_scylla: true

user_prefix: 'perf-predefined-steps-lwt-light'
argus_email_report_template: email_report_performance.yaml

backtrace_decoding: true
backtrace_stall_decoding: false

use_mgmt: false
email_recipients: ['scylla-perf-results@scylladb.com']

use_hdrhistogram: true

append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
append_scylla_yaml:
  auto_snapshot: false

use_prepared_loaders: false

adaptive_timeout_store_metrics: false

stop_test_on_stress_failure: false

teardown_validators:
  test_error_events:
    enabled: true

prepare_stress_cmd: "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=1 -mode connectionsPerHost=64 cql3 native -rate 'threads=1'"

prepare_write_cmd: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=1..17142857",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=17142858..34285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=34285715..51428571",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=51428572..68571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=68571429..85714285",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=85714286..102857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142858 -mode connectionsPerHost=64 cql3 native -rate threads=50 -pop seq=102857143..120000000"
]

stress_cmd_w: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..17142857",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142858..34285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=34285715..51428571",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=51428572..68571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=68571429..85714285",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=85714286..102857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=102857143..120000000"
]

stress_cmd_r: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=25714285..30000000"
]

stress_cmd_cache_warmup: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285716 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=25714285..30000000"
]

stress_cmd_m: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_small.yaml 'ops(stmt-insert-if-not-exists=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=25714285..30000000"
]
