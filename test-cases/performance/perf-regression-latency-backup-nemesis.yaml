test_metadata:
  description: >-
    Measures mixed-workload latency on a 6-node i4i.2xlarge cluster while Scylla
    Manager backs up the data to S3 or GCS (native or rclone uploader). Prepare and
    stress commands come from a dataset overlay, such as 2TB_backup_dataset.yaml,
    that the pipeline must add.
  test_type: performance
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
    - gce
  stress_tools:
    - cassandra-stress
  workload: mixed
  features: []
  team_ownership: core-test-infra

test_duration: 1200

# Note: the running test MUST be supplied with a dataset file
# that contains at least these two fields
# prepare_write_cmd
# stress_cmd_m

instance_type_db: 'i4i.2xlarge'
gce_instance_type_db: 'n2-highmem-8'
n_db_nodes: 6

instance_type_loader: 'c6i.2xlarge'
gce_instance_type_loader: 'c4-highcpu-8'
gce_root_disk_type_loader: 'hyperdisk-balanced'
n_loaders: 4

aws_instance_profile_name_db: 'qa-scylla-manager-backup-instance-profile'
user_prefix: 'manager-backup-benchmark'
use_hdrhistogram: true

ami_id_db_scylla_desc: 'VERSION_DESC'
nemesis_interval: 1
round_robin: true

backtrace_decoding: true
backtrace_stall_decoding: false
argus_email_report_template: email_report_performance.yaml

use_prepared_loaders: false
use_placement_group: true
use_capacity_reservation: false
email_subject_postfix: 'latency during operations'
cluster_health_check: false
hinted_handoff: 'enabled'
workload_name: 'mixed'
