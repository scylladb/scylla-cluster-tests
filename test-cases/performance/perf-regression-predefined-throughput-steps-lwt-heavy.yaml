    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285714 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=ALL n=4285716 -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads' -pop seq=25714285..30000000"
]

