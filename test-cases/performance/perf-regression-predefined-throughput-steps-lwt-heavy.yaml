    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1,stmt-select=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=25714285..30000000"
]
