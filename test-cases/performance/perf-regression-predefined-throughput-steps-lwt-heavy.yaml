# LWT Heavy Predefined Throughput Steps test — 3-node cluster
#
# Workload: Heavy LWT operations using cs_lwt_perf_big.yaml profile
#   write  (stress_cmd_w)  — UPDATE ... IF <9-col condition>  (heavy: composite PK, wide row ~1.3KB)
#   read   (stress_cmd_r)  — SELECT by composite PK           (non-LWT QUORUM read on wide row)
#   mixed  (stress_cmd_m)  — UPDATE IF cond + SELECT          (50/50 mix)
#
# Used by:
#   scylla-enterprise-perf-regression-predefined-throughput-steps-lwt-heavy-vnodes.jenkinsfile
#   scylla-enterprise-perf-regression-predefined-throughput-steps-lwt-heavy-tablets.jenkinsfile

test_duration: 500

test_metadata:
  description: >-
    Gradual-throughput LWT performance comparison between tablets and vnodes on a
    3-node cluster, using heavy (wide ~1.3KB row) conditional UPDATE/SELECT workloads
    at predefined throttled throughput steps for write, read, and mixed sub-tests.
  test_type: performance
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: lwt
  features:
    - tablets
    - vnodes

# Keyspace and table come from cs_lwt_perf_big.yaml profile
perf_stress_keyspace: ks
perf_stress_table: targettable

round_robin: true

n_db_nodes: 3
n_loaders: 7

instance_type_db: 'i8g.2xlarge'
instance_type_loader: 'c7i.xlarge'
instance_type_monitor: 't3.large'
use_capacity_reservation: true
use_placement_group: true
nemesis_add_node_cnt: 0

use_preinstalled_scylla: true

user_prefix: 'perf-predefined-steps-lwt-heavy'
argus_email_report_template: email_report_performance.yaml

backtrace_decoding: true
backtrace_stall_decoding: false

use_mgmt: false
email_recipients: ['scylla-perf-results@scylladb.com']

use_hdrhistogram: true

append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
append_scylla_yaml:
  auto_snapshot: false

use_prepared_loaders: false

adaptive_timeout_store_metrics: false

# Keep running through stress failures so the full gradual-load step sequence completes
# before Grafana data is collected.
stop_test_on_stress_failure: false

teardown_validators:
  test_error_events:
    enabled: true

# Preload real data before the write step: the write workload uses a conditional
# UPDATE ... IF <cond>, which only applies against existing rows.
perf_gradual_write_preload_data: true

prepare_stress_cmd: "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=1 -mode connectionsPerHost=8 cql3 native -rate 'threads=1'"

prepare_write_cmd: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=1..17142857",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=17142858..34285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=34285715..51428571",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=51428572..68571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=68571429..85714285",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142857 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=85714286..102857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(insert=1)' no-warmup cl=ALL n=17142858 -mode connectionsPerHost=8 cql3 native -rate threads=50 -pop seq=102857143..120000000"
]

stress_cmd_w: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..17142857",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142858..34285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=34285715..51428571",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=51428572..68571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=68571429..85714285",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=85714286..102857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-update-if-cond=1)' no-warmup cl=QUORUM serial-cl=LOCAL_SERIAL duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=102857143..120000000"
]

stress_cmd_r: [
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..4285714",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=4285715..8571428",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=8571429..12857142",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=12857143..17142856",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=17142857..21428570",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=21428571..25714284",
    "cassandra-stress user profile=/tmp/cs_lwt_perf_big.yaml 'ops(stmt-select=1)' no-warmup cl=QUORUM duration=$duration -mode connectionsPerHost=1000 cql3 native -rate 'threads=$threads $throttle' -pop seq=25714285..30000000"
]

