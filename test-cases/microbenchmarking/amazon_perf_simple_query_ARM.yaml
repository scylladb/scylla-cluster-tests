test_metadata:
  description: >-
    Weekly ScyllaDB perf-simple-query microbenchmark run directly on a single
    c7g.large (ARM) DB node, with no loaders and no monitor. The pipeline selects
    the read or write mode; results are compared per release in Argus. Also the base
    config for the x86_64 variant.
  test_type: microbenchmarking
  tier: release
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  features: []
  team_ownership: core-test-infra

test_duration: 60
backtrace_decoding: false
cluster_backend: 'aws'

n_loaders: 0
n_monitor_nodes: 0
n_db_nodes: 1
use_mgmt: false

instance_type_db: 'c7g.large'
data_volume_disk_num: 1
user_prefix: 'perf-microbenchmarking-amazon-ARM'
argus_email_report_template: email_report_performance_microbenchmarks.yaml
instance_provision: "spot"
instance_provision_fallback_on_demand: true

email_recipients: ['scylla-perf-results@scylladb.com']
