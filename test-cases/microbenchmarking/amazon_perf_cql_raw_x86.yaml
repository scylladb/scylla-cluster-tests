test_metadata:
  description: >-
    Overlay for the perf-cql-raw microbenchmark that switches the single DB node to
    c8i.xlarge (x86_64). Applied on top of amazon_perf_cql_raw_ARM.yaml by the x86_64
    read and write microbenchmark pipelines.
  test_type: microbenchmarking
  tier: release
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  features: []
  team_ownership: core-test-infra

instance_type_db: 'c8i.xlarge'
user_prefix: 'perf-cql-raw-amazon-x86'
