test_duration: 300

stress_cmd: [
    "nosqlbench cql_tabular rampup-cycles=1M main-cycles=100M write_cl=LOCAL_QUORUM read_cl=LOCAL_QUORUM rf=1 partsize=1000000 partcount=1000 driver=cqld4 -v --progress console:5s",
]

n_db_nodes: 3
n_loaders: 1

sizing_db:
  vcpu: 16
  # OCI DenseIO.E5 at 16 vCPUs provides only 96 GB (12 GB/OCPU fixed ratio).
  # Lowered from >=128 to >=96 so OCI can match; other clouds still pick >=128 naturally.
  memory: '>=96'
sizing_loader:
  vcpu: 4
  memory: '>=16'

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: "not disruptive"
nemesis_interval: 10

user_prefix: 'longevity-nosqlbench-3h'
space_node_threshold: 64424

use_preinstalled_scylla: true
