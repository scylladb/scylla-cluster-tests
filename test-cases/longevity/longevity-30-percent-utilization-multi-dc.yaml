test_metadata:
  description: >-
    Multi-DC variant of longevity-30-percent-utilization-4h: 2 DCs x 3 i8g.xlarge nodes with RF=3 in
    each DC, filled to ~30% disk per node. A region-aware loader in each DC runs cassandra-stress at
    LOCAL_QUORUM: prepare, a 600m mixed workload, then a read-back of every row, under SisyphusMonkey.
  test_type: longevity
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  features:
    - multi-dc
    - tablets
    - tls-ssl
  team_ownership: scylladb/storage-qa

test_duration: 840

n_db_nodes: [3, 3]
n_loaders: [1, 1]
region_aware_loader: true
seeds_num: 3
simulated_racks: 3

round_robin: true

instance_type_db: 'i8g.xlarge'

nemesis_class_name: 'SisyphusMonkey'
# disk utilization depends on IncrementalCompactionStrategy; keep it for the whole run
nemesis_selector: 'not ModifyTableCompactionMonkey and not ModifyTableTwcsWindowSizeMonkey'
nemesis_interval: 15

user_prefix: 'longevity-multi-dc-30-percent'

pre_create_schema: true

server_encrypt: true
client_encrypt: true

hinted_handoff: 'enabled'
parallel_node_operations: true

nemesis_during_prepare: false

# fill_percent is the share of the usable /var/lib/scylla disk (per node, after RF) the prepare phase writes.
# Every DC holds a full copy of the data, so the rows are sized from the node count of one DC.
stress_template_context:
  fill_percent: 30
  replication_factor: 3
  col_count: 4
  col_size_bytes: 512
  row_size_bytes: "{{ col_count * col_size_bytes + 10 }}"  # + key
  total_rows: "{{ ((effective_disk_size_bytes * db_node_count_per_dc * fill_percent) // 100 // replication_factor // row_size_bytes) | int }}"
  rows_per_cmd: "{{ total_rows // 2 }}"
  populated_rows: "{{ rows_per_cmd * 2 }}"

# LOCAL_QUORUM: each loader waits only for its own DC; QUORUM needs 4 of 6 replicas and crosses regions.
prepare_write_cmd:
  - >-
    cassandra-stress write cl=LOCAL_QUORUM n={{ rows_per_cmd }}
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }}) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=160
    -pop seq=1..{{ rows_per_cmd }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5
  - >-
    cassandra-stress write cl=LOCAL_QUORUM n={{ rows_per_cmd }}
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }}) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=160
    -pop seq={{ rows_per_cmd + 1 }}..{{ populated_rows }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5

stress_cmd:
  - >-
    cassandra-stress mixed cl=LOCAL_QUORUM duration=600m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }}) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=100 throttle=15000/s
    -pop seq=1..{{ rows_per_cmd }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5
  - >-
    cassandra-stress mixed cl=LOCAL_QUORUM duration=600m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }}) compaction(strategy=IncrementalCompactionStrategy)'
    -mode cql3 native
    -rate threads=100 throttle=15000/s
    -pop seq={{ rows_per_cmd + 1 }}..{{ populated_rows }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5

stress_read_cmd:
  - >-
    cassandra-stress read cl=LOCAL_QUORUM n={{ rows_per_cmd }}
    -mode cql3 native
    -rate threads=200
    -pop seq=1..{{ rows_per_cmd }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5
  - >-
    cassandra-stress read cl=LOCAL_QUORUM n={{ rows_per_cmd }}
    -mode cql3 native
    -rate threads=200
    -pop seq={{ rows_per_cmd + 1 }}..{{ populated_rows }}
    -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})'
    -log interval=5

use_hdrhistogram: true
