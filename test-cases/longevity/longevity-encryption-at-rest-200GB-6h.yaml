test_metadata:
  description: >-
    Longevity test validating encryption-at-rest (server_encrypt) with a ~200GB dataset, running
    mixed cassandra-stress write/read workloads plus a full-scan check for ~6 hours on a 6-node
    single-DC cluster with SisyphusMonkey nemesis.
  test_type: longevity
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  features:
    - encryption-at-rest
    - tls-ssl
  team_ownership: storage-qa

test_duration: 550
prepare_write_cmd: "cassandra-stress write cl=ALL n=200200300  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=1000 -col 'size=FIXED(200) n=FIXED(5)' -pop seq=1..200200300 -log interval=15"

stress_cmd: ["cassandra-stress write cl=QUORUM duration=360m  -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=50  -col 'size=FIXED(200) n=FIXED(5)' -pop seq=400200300..600200300 -log interval=15"]
stress_read_cmd: ["cassandra-stress read cl=ONE duration=360m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=50  -col 'size=FIXED(200) n=FIXED(5)' -pop seq=1..200200300 -log interval=5"]
run_fullscan: ['{"mode": "table_and_aggregate", "ks_cf": "keyspace1.standard1", "interval": 5}']
n_db_nodes: 6
n_loaders: 2

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 8
  memory: '>=64'
  arch: x86_64
  local_disk_gb: '>=1500'

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'limited'
nemesis_seed: 28
nemesis_during_prepare: false

user_prefix: 'longevity-encrypt-at-rest-200gb-6h-tls'

space_node_threshold: 644245094

server_encrypt: true

pre_create_schema: True
