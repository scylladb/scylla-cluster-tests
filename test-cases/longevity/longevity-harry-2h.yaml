test_metadata:
  description: >-
    Longevity test running the cassandra-harry fuzzing/verification tool for 2 hours on a 6-node
    single-DC cluster with SisyphusMonkey nemesis (ENOSPC-safe selector), validating data
    consistency under continuous chaos.
  test_type: longevity
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  features: []
  team_ownership: storage-qa

test_duration: 240
stress_cmd: ["cassandra-harry -run-time 2 -run-time-unit HOURS"]

n_db_nodes: 6
n_loaders: 1

instance_type_db: 'i4i.large'

root_disk_size_loader: 80 # enlarge loader disk, cause of cassandra-harry operation.log that can't be disabled

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: "not enospc"
nemesis_interval: 2

user_prefix: 'longevity-harry-2h'
space_node_threshold: 64424
use_mgmt: false
