test_metadata:
  description: >-
    12-hour longevity test that hammers large CQL collections: a cassandra-stress user profile
    inserting, reading and updating oversized collection cells on a 6-node cluster under
    SisyphusMonkey, with the large-collection validator on so warnings about oversized collections are
    asserted rather than ignored.
  test_type: longevity
  tier: tier2
  duration_class: medium
  supported_backends:
    - aws
    - k8s-eks
  stress_tools:
    - cassandra-stress
  workload: user-profile
  nemesis_labels:
    - SisyphusMonkey
  features:
    - large-collections
  team_ownership: core-test-infra

test_duration: 840
stress_cmd: [
"JVM_OPTION='-Xms8033M -Xmx8033M -Xmn400M' cassandra-stress user profile=/tmp/large_collections.yaml ops'(insert=3,read1=1,update1=1)' cl=QUORUM duration=720m -mode cql3 native -rate threads=20"
             ]

n_db_nodes: 6
n_loaders: 1

instance_type_db: 'i3en.3xlarge'

nemesis_class_name: 'SisyphusMonkey'
nemesis_seed: '012'
nemesis_interval: 15

user_prefix: 'longevity-large-collections-12h'
space_node_threshold: 64424

validate_large_collections: true
root_disk_size_runner: 150
