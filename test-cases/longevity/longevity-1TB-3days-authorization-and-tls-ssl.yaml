test_metadata:
  description: >-
    3-day longevity test that preloads 1TB across 4 loaders and then runs mixed and read
    cassandra-stress streams plus a materialized-view user profile at QUORUM on a 3-node encrypted
    cluster with SisyphusMonkey. Run with the auth_cassandra overlay and SizeTieredCompactionStrategy,
    this is the small-cluster, large-dataset stress point.
  test_type: longevity
  tier: tier2
  duration_class: long
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  features:
    - tls-ssl
    - authorization
  team_ownership: core-test-infra

test_duration: 5020
prepare_write_cmd: ["cassandra-stress write cl=ALL n=275050075 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=150 -col 'size=FIXED(200) n=FIXED(5)' -pop seq=1..275050075",
                    "cassandra-stress write cl=ALL n=275050075 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=150 -col 'size=FIXED(200) n=FIXED(5)' -pop seq=275050076..550100150",
                    "cassandra-stress write cl=ALL n=275050075 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=150 -col 'size=FIXED(200) n=FIXED(5)' -pop seq=550100151..825150225",
                    "cassandra-stress write cl=ALL n=275050075 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=150 -col 'size=FIXED(200) n=FIXED(5)' -pop seq=825150226..1100200300"]

stress_cmd: ["cassandra-stress mixed cl=QUORUM duration=4140m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=100 -pop seq=1..550100150 -log interval=5 -col 'size=FIXED(200) n=FIXED(5)'",
             "cassandra-stress mixed cl=QUORUM duration=4140m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=100 -pop seq=550100151..1100200300 -log interval=5 -col 'size=FIXED(200) n=FIXED(5)'",
             "cassandra-stress read cl=QUORUM duration=4140m -mode cql3 native -rate threads=10 -pop seq=1..550100150 -log interval=5 -col 'size=FIXED(200) n=FIXED(5)'",
             "cassandra-stress read cl=QUORUM duration=4140m -mode cql3 native -rate threads=10 -pop seq=550100151..1100200300 -log interval=5 -col 'size=FIXED(200) n=FIXED(5)'"]

run_fullscan: ['{"mode": "table_and_aggregate", "ks_cf": "random", "interval": 120}'] # 'ks.cf|random, interval(min)'
round_robin: true

n_db_nodes: 3
n_loaders: 4
seeds_num: 3

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 8
  memory: '>=64'

sizing_loader:
  vcpu: 8
  memory: '>=16'

nemesis_class_name: 'SisyphusMonkey'
nemesis_seed: '555'
nemesis_interval: 30

user_prefix: 'longevity-tls-1tb-3d-stcs'
space_node_threshold: 644245094
server_encrypt: true
client_encrypt: true

nemesis_during_prepare: false
use_preinstalled_scylla: true
