test_metadata:
  description: >-
    Longevity test running concurrent per-user-role cassandra-stress workloads with service levels
    on a multi-DC cluster (2x6 nodes) for 12 hours, while parallel topology-change and schema-
    change SisyphusMonkey nemeses run per DC to validate cluster stability under concurrent
    structural changes.
    fill_percent is the share of the usable /var/lib/scylla disk (per node, after RF) the prepare
    phase writes; 12% writes ~197M rows on an 872 GiB disk and leaves ~13% of the disk used after
    the cassandra-stress prepare, ~19% once the 10M-row user-profile prepare is added (measured in Argus).
  test_type: longevity
  tier: tier1
  duration_class: medium
  stress_tools:
    - cassandra-stress
  workload: mixed
  features:
    - multi-dc
    - tls-ssl
    - authorization
    - sla
  team_ownership: storage-qa

test_duration: 1200

stress_template_context:
  fill_percent: 12
  replication_factor: 3
  col_count: 8
  col_size_bytes: 128
  row_size_bytes: "{{ col_count * col_size_bytes + 10 }}"  # + key
  total_rows: "{{ ((effective_disk_size_bytes * db_node_count_per_dc * fill_percent) // 100 // replication_factor // row_size_bytes) | int }}"

# `connectionsPerHost` - target a specific number of TCP connections per shard.
# For a single DC:
#   L = number of loaders in this DC
#   P = number of cassandra-stress processes per loader
#   S = number of shards per node
#   C_target = desired connections per shard
#
# Each cassandra-stress process opens `connectionsPerHost
# Calculation for one node:
#   total_connections_per_node = L * P * connectionsPerHost
# Per shard on that node:
#   connections_per_shard = total_connections_per_node / S
#
# For this test:
#   L = 2   (loaders per DC)
#   users = 3, commands per user = 3  =>  P = 3 * 3 = 9 processes per loader
#   S = 4   (shards per node)
#
# With the current setting:
#   connectionsPerHost = 200
#   total_connections_per_node = 2 * 9 * 200 = 3600
#   connections_per_shard      = 3600 / 4    = 900 ≈ 1000 conn/shard

pre_create_keyspace: [
    "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3};",
    "CREATE TABLE keyspace1.standard2 (key blob, c0 blob, c1 blob, c2 blob, c3 blob, c4 blob, PRIMARY KEY (key))  WITH compaction = {'class': 'LeveledCompactionStrategy'} AND compression = {'chunk_length_in_kb': '64', 'sstable_compression': 'org.apache.cassandra.io.compress.ZstdCompressor'};",
    "CREATE ROLE IF NOT EXISTS stress_user1 WITH LOGIN = true AND PASSWORD = 'stress_user1' AND SUPERUSER = false;",
    "CREATE ROLE IF NOT EXISTS stress_user2 WITH LOGIN = true AND PASSWORD = 'stress_user2' AND SUPERUSER = false;",
    "CREATE ROLE IF NOT EXISTS stress_user3 WITH LOGIN = true AND PASSWORD = 'stress_user3' AND SUPERUSER = false;",
    "GRANT ALL ON ALL KEYSPACES TO stress_user1;",
    "GRANT ALL ON ALL KEYSPACES TO stress_user2;",
    "GRANT ALL ON ALL KEYSPACES TO stress_user3;",
    "CREATE SERVICE_LEVEL IF NOT EXISTS sl_test_1 WITH SHARES = 500;",
    "CREATE SERVICE_LEVEL IF NOT EXISTS sl_test_2  WITH SHARES = 300;",
    "CREATE SERVICE_LEVEL IF NOT EXISTS sl_test_3  WITH SHARES = 1000;",
    "ATTACH SERVICE_LEVEL sl_test_1 TO stress_user1;",
    "ATTACH SERVICE_LEVEL sl_test_2 TO stress_user2;",
    "ATTACH SERVICE_LEVEL sl_test_3 TO stress_user3;",
]

prepare_write_cmd:  [
    "cassandra-stress write cl=LOCAL_QUORUM n={{ total_rows }} -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native connectionsPerHost=1000 -rate threads=30 -pop seq=1..{{ total_rows }} -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress user profile=/tmp/cs_multidc_si_lcs.yaml ops'(insert=1)' cl=LOCAL_QUORUM n=10M -mode cql3 native connectionsPerHost=1000 -rate threads=5 -log interval=5"
]

stress_cmd: [
    "cassandra-stress write cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user1 password=stress_user1  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress read  cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user1 password=stress_user1  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress user profile=/tmp/cs_multidc_si_lcs.yaml ops'(insert=1,read=1,si_read1=1,si_read2=1)' cl=LOCAL_QUORUM duration=700m -mode cql3 native  user=stress_user1 password=stress_user1  connectionsPerHost=200 -rate threads=4 -log interval=5",
    "cassandra-stress write cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user2 password=stress_user2  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress read  cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user2 password=stress_user2  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress user profile=/tmp/cs_multidc_si_lcs.yaml ops'(insert=1,read=1,si_read1=1,si_read2=1)' cl=LOCAL_QUORUM duration=700m -mode cql3 native  user=stress_user2 password=stress_user2  connectionsPerHost=200 -rate threads=4 -log interval=5",
    "cassandra-stress write cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user3 password=stress_user3  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress read  cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor={{ replication_factor }})' -mode cql3 native  user=stress_user3 password=stress_user3  connectionsPerHost=200 -rate threads=4 -pop 'dist=uniform(1..{{ total_rows }})' -col 'n=FIXED({{ col_count }}) size=FIXED({{ col_size_bytes }})' -log interval=5",
    "cassandra-stress user profile=/tmp/cs_multidc_si_lcs.yaml ops'(insert=1,read=1,si_read1=1,si_read2=1)' cl=LOCAL_QUORUM duration=700m -mode cql3 native  user=stress_user3 password=stress_user3  connectionsPerHost=200 -rate threads=4 -log interval=5",
]

availability_zone: 'a,b,c'
n_db_nodes: [6, 6]
n_loaders: [2, 2]

region_aware_loader: true
simulated_racks: 0

sizing_db:
  vcpu: 4
  memory: '>=32'
  arch: x86_64
  local_disk_gb: '>=900'

nemesis_class_name: ['SisyphusMonkey', 'SisyphusMonkey']
# keyspace1.standard2 is created with LCS and Zstd compression in pre_create_keyspace; keep them for the whole run
nemesis_selector: ["topology_changes", "schema_changes and not disruptive and not ModifyTableCompactionMonkey and not ModifyTableCompressionMonkey"]
nemesis_interval: 10
nemesis_during_prepare: false

seeds_num: 3
# disabled the round robin, so each command would run on every loader.
round_robin: false

server_encrypt: true
internode_encryption: 'dc'

user_prefix: 'parallel-topology-schema-changes-multidc-12h'

topology_barrier_stall_events: true
