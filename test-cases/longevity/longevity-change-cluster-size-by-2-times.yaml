test_metadata:
  description: >-
    12-hour longevity test that doubles and halves the cluster while schema changes run: two
    SisyphusMonkey instances in parallel, one restricted to GrowShrinkClusterNemesis and one to
    non-disruptive schema_changes, against cassandra-stress write and read streams plus a
    materialized-view/secondary-index user profile on a 3-node cluster.
  test_type: longevity
  tier: tier2
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  team_ownership: core-test-infra

test_duration: 900

prepare_write_cmd:
  - >-
    cassandra-stress write cl=QUORUM no-warmup
    n=20971520
    -pop seq=1..20971520
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=LeveledCompactionStrategy)'
    -col 'n=FIXED(5) size=FIXED(128)'
    -mode cql3 native
    -log interval=5
    -rate threads=10
  - >-
    cassandra-stress user profile=/tmp/cs_mv_si_keyspace1.yaml no-warmup ops'(insert=1)'
    n=3000000
    -mode cql3 native
    -log interval=5
    -rate threads=10

stress_cmd:
  - >-
    cassandra-stress write cl=QUORUM no-warmup
    duration=720m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=LeveledCompactionStrategy)'
    -col 'n=FIXED(5) size=FIXED(128)'
    -mode cql3 native
    -log interval=5
    -rate threads=5
    -pop 'dist=uniform(1..20971520)'
  - >-
    cassandra-stress read cl=QUORUM no-warmup
    duration=720m
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=LeveledCompactionStrategy)'
    -col 'n=FIXED(5) size=FIXED(128)'
    -mode cql3 native
    -log interval=5
    -rate threads=5
    -pop 'dist=uniform(1..20971520)'
  - >-
    cassandra-stress user profile=/tmp/cs_mv_si_keyspace1.yaml no-warmup ops'(insert=1,read=1,mv_read1=1,mv_read2=1)'
    duration=700m
    -mode cql3 native
    -log interval=5
    -rate threads=5
  - >-
    cassandra-stress user profile=/tmp/cs_mv_si_keyspace1.yaml no-warmup ops'(insert=1,read=1,si_read1=1,si_read2=1)'
    duration=700m
    -mode cql3 native
    -log interval=5
    -rate threads=5


n_db_nodes: 3
n_loaders: 2

sizing_db:
  # Use >=8 (not exact 8) so OCI can match:
  # OCI DenseIO starts at 16 vCPU .
  # AWS/Azure/GCE still resolve to their 8-vCPU instances (smallest fitting).
  vcpu: ">=8"
  memory: ">=64"

nemesis_class_name: ['SisyphusMonkey', 'SisyphusMonkey']
nemesis_selector: ["GrowShrinkClusterNemesis","schema_changes and not disruptive"]
nemesis_interval: 10

round_robin: true

user_prefix: 'raft-double-cluster-size-with-schema-changes-12h'
space_node_threshold: 64424
