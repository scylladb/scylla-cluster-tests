test_metadata:
  description: >-
    12-hour rack-aware multi-DC longevity test with zero-token nodes: two data DCs of 6 nodes plus
    zero-token nodes placed in a third DC, driven by rack-aware loaders at LOCAL_QUORUM with
    SisyphusMonkey. Verifies that zero-token members in a separate DC do not break rack-aware routing
    or topology operations.
  test_type: longevity
  tier: tier1
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  features:
    - multi-dc
    - rack-aware
    - zero-token-nodes
  team_ownership: core-test-infra

test_duration: 800

prepare_write_cmd:  ["cassandra-stress write cl=LOCAL_QUORUM n=20971520 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3,eu-northscylla_node_north=0)' -port jmx=6868 -mode cql3 native -rate threads=80 -pop seq=1..20971520 -col 'n=FIXED(10) size=FIXED(512)' -log interval=5",
                    ]

stress_cmd: ["cassandra-stress write cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3,eu-northscylla_node_north=0)' -port jmx=6868 -mode cql3 native -rate threads=40 -pop 'dist=uniform(1..20971520)' -col 'n=FIXED(10) size=FIXED(512)' -log interval=5 -errors retries=50",
             "cassandra-stress read  cl=LOCAL_QUORUM duration=720m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3,eu-northscylla_node_north=0)' -port jmx=6868 -mode cql3 native -rate threads=40 -pop 'dist=uniform(1..20971520)' -col 'n=FIXED(10) size=FIXED(512)' -log interval=5 -errors retries=50",
             ]
n_db_nodes: '6 6 0'
n_loaders: '1 1'
n_db_zero_token_nodes: '0 1 1'
availability_zone: 'a,b,c'

rack_aware_loader: true
region_aware_loader: true
simulated_racks: 0

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 8
  memory: '>=64'
zero_token_instance_type_db: 'i8g.large'
use_zero_nodes: true

nemesis_class_name: 'SisyphusMonkey'
nemesis_interval: 10

user_prefix: 'multi-dc-rackaware-with-znode-dc'
