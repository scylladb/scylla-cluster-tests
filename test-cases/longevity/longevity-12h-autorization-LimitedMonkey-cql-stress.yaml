# Longevity test: asymmetric cluster – 12 h authorization + LimitedMonkey
#
# Dataset:
#   - Prepare:      450M rows (2 commands × 225M rows in parallel on 1 loader)
#   - Stress:       mixed 50/50 read/write over seq 1..450M, throttled 30k ops/s
#   - Total:        450M rows × ~1 KB per row ≈ ~450 GB logical (single replica basis)
#
# Disk utilization targets (RF=3, 6 nodes, 1 KB/row):
#   - Prepare:             ~60%  (GCE: ~225 GB / 375 GB NVMe, 1× local SSD)
#                                (AWS:  ~12%, ~225 GB / 1875 GB NVMe, i7i.2xlarge)
#   - Stress:       no net growth - the write half overwrites the prepared range

test_metadata:
  description: >-
    Longevity test with asymmetric 6-node cluster running 12 h authorization
    with LimitedMonkey nemesis. Dataset of ~450 GB logical (RF=3) prepared from a
    single loader, followed by mixed QUORUM read/write stress. Validates stability
    under sustained load with encryption and rolling compaction.
  test_type: longevity
  tier: tier1
  duration_class: long
  supported_backends:
    - gce
    - aws
  stress_tools:
    - cql-stress-cassandra-stress

test_duration: 750

prepare_write_cmd: "cql-stress-cassandra-stress write cl=ALL n=450000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(256) n=FIXED(4)' -pop seq=1..450000000 -log interval=15"

stress_cmd: "cql-stress-cassandra-stress mixed cl=QUORUM duration=11h -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native -rate 'threads=200 throttle=30000/s' -col 'size=FIXED(256) n=FIXED(4)' -pop seq=1..450000000 -log interval=15"

run_fullscan: ['{"mode": "table_and_aggregate", "ks_cf": "keyspace1.standard1", "interval": 5}']

n_db_nodes: 6
n_loaders: 1
simulated_racks: 3
round_robin: true

instance_type_db: 'i7i.2xlarge'
instance_type_loader: 'c6i.large'

gce_instance_type_db: 'n2-highmem-8'
gce_instance_type_loader: 'e2-standard-2'
gce_n_local_ssd_disk_db: 1

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'limited'
nemesis_interval: 30
nemesis_during_prepare: false

user_prefix: 'longevity-6nodes-12h'

space_node_threshold: 322122547

server_encrypt: true
client_encrypt: true

use_preinstalled_scylla: true
