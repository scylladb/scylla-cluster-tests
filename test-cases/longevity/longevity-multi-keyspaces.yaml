#       tools. No pipeline uses it, so run it explicitly with:
#
#           longevity_test.LongevityTest.test_batch_custom_time

test_metadata:
  description: >-
    60-hour schema-scale longevity test: 1000 keyspaces pre-created on a 6-node cluster, each driven
    in batch mode by cassandra-stress from 10 loaders, with random-keyspace fullscans and
    SisyphusMonkey. Exercises how metadata, schema propagation and per-table overhead behave at high
    keyspace counts.
  test_type: longevity
  tier: ondemand
  duration_class: long
  supported_backends:
    - aws
    - gce
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  team_ownership: core-test-infra

