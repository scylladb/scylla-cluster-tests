test_metadata:
  description: >-
    4-day large-partition longevity test: scylla-bench writes and reads 200k-row partitions
    sized to fill ~50% of a >=3 TB node disk on a 6-node cluster under SisyphusMonkey, with
    partition fullscan data validation and tombstone-GC verification on a materialized view
    whose tombstone_gc mode is set to 'repair'. The high-disk-capacity variant of the
    200k-pks 4-day test, run by the GCE tier1 pipeline.
  test_type: longevity
  tier: tier1
  duration_class: long
  supported_backends:
    - gce
  stress_tools:
    - scylla-bench
  workload: mixed
  features:
    - large-partitions
    - tombstone-gc
  team_ownership: scylladb/storage-qa

test_duration: 6480

# Dataset is sized from the available disk.
# prepare_fill_percent and stress_fill_percent are the shares of the usable /var/lib/scylla disk
# (per node, after RF and the view) the prepare and stress phases write, 56% in total.

stress_template_context:
  replication_factor: 3
  rows_per_partition: 200000
  prepare_row_bytes: 2816  # mean of uniform:512..5120
  stress_row_bytes: 4146  # mean of uniform:100..8192
  table_copies: 2  # base table + view_test
  prepare_fill_percent: 49
  stress_fill_percent: 7
  prepare_partitions_per_cmd: "{{ ((effective_disk_size_bytes * db_node_count_per_dc * prepare_fill_percent) // 100 // replication_factor // table_copies // (rows_per_partition * prepare_row_bytes) // 5) | int }}"
  prepare_partitions: "{{ prepare_partitions_per_cmd * 5 }}"
  stress_partitions: "{{ ((effective_disk_size_bytes * db_node_count_per_dc * stress_fill_percent) // 100 // replication_factor // table_copies // (rows_per_partition * stress_row_bytes)) | int }}"

# Writing prepare_partitions partitions, 200k clustering rows each (1 write command per loader).
prepare_write_cmd:  ["scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset=1 -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=250 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -validate-data",
                     "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset={{ prepare_partitions_per_cmd + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=250 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -validate-data",
                     "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset={{ prepare_partitions_per_cmd * 2 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=250 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -validate-data",
                     "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset={{ prepare_partitions_per_cmd * 3 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=250 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -validate-data",
                     "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset={{ prepare_partitions_per_cmd * 4 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=250 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -validate-data"
                    ]

# Not verifying the entire range, only 50 partitions per prepare range
prepare_verify_cmd: ["scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count=50 -partition-offset={{ prepare_partitions_per_cmd + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=50 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations 1 -validate-data",
                     "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count=50 -partition-offset={{ prepare_partitions_per_cmd * 2 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=50 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations 1 -validate-data",
                     "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count=50 -partition-offset={{ prepare_partitions_per_cmd * 3 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=50 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations 1 -validate-data",
                     "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count=50 -partition-offset={{ prepare_partitions_per_cmd * 4 + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=50 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations 1 -validate-data",
                     "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count=50 -partition-offset={{ prepare_partitions - 99 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=50 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations 1 -validate-data"
                    ]

stress_cmd: [
              # Write stress_partitions additional partitions with 200k rows each after the prepared range
             "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ stress_partitions }} -partition-offset={{ prepare_partitions + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:100..8192 -concurrency=2 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations=0 -duration=6420m -retry-number=30 -retry-interval=500ms,5s",
              # Re-write the second and third prepare ranges, otherwise the delete nemeses may empty the table
             "scylla-bench -workload=sequential -mode=write -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd * 2 }} -partition-offset={{ prepare_partitions_per_cmd + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=2 -connection-count=10 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations=0 -duration=6420m -retry-number=30 -retry-interval=500ms,5s"
            ]

stress_read_cmd: [
                   # Read the first prepare range with validate-data flag (Partitions we don't delete during the test)
                  "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd }} -partition-offset=1 -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -concurrency=12 -connection-count=100 -consistency-level=quorum -rows-per-request=10 -timeout=90s -iterations=0 -duration=6420m -validate-data -retry-number=30 -retry-interval=500ms,5s",
                   # Read the other four prepare ranges
                  "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count={{ prepare_partitions_per_cmd * 4 }} -partition-offset={{ prepare_partitions_per_cmd + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:512..5120 -rows-per-request=10 -consistency-level=quorum -timeout=90s -concurrency=50 -connection-count=100 -iterations=0 -duration=6420m -retry-number=30 -retry-interval=500ms,5s",
                   # Read the partitions that are being written during the test (different row size)
                  "scylla-bench -workload=sequential -mode=read -replication-factor={{ replication_factor }} -partition-count={{ stress_partitions }} -partition-offset={{ prepare_partitions + 1 }} -clustering-row-count={{ rows_per_partition }} -clustering-row-size=uniform:100..8192 -rows-per-request=10 -consistency-level=quorum -timeout=90s -concurrency=37 -connection-count=100 -iterations=0 -duration=6420m -retry-number=30 -retry-interval=500ms,5s"
                 ]

# Create MV, set tombstone_gc to 'repair' + a propagation_delay_in_seconds of 5 minutes for the tombstone-gc-verification table,
# and compress the base table (the MV inherits the base table compression):
post_prepare_cql_cmds: ["CREATE MATERIALIZED VIEW scylla_bench.view_test AS SELECT * FROM scylla_bench.test where ck IS NOT NULL AND v is not null PRIMARY KEY (v, pk, ck) with comment = 'TEST VIEW'",
                        "ALTER TABLE scylla_bench.test with tombstone_gc = {'mode': 'repair', 'propagation_delay_in_seconds':'300'};",
                        "ALTER TABLE scylla_bench.test WITH compression = {'sstable_compression': 'LZ4Compressor'};"
                       ]

n_db_nodes: 6
n_loaders: 5 # Each loader will have 1 scylla-bench process at every step of the test (prepare, verify, stress & stress_read)

round_robin: true

sizing_db:  # no azure/oci match with the disk constraint
  vcpu: 8
  memory: '>=64'
  local_disk_gb: '3000-5000'  # z3-highmem-8-highlssd on GCE, i8ge.2xlarge on AWS
sizing_loader:
  vcpu: 16
  memory: '>=16'

nemesis_class_name: 'SisyphusMonkey'
nemesis_interval: 30
# Skip nemeses that write another copy of the dataset (index, MV, backup)
nemesis_selector: 'supports_high_disk_utilization'
nemesis_during_prepare: false

# Topology and repair operations take longer with the large partitions
adaptive_timeout_multipliers:
  decommission: 5
  new_node: 5
  remove_node: 5
  repair: 5
  mgmt_repair: 5

user_prefix: 'longevity-large-partitions-200k-pks-4d'

space_node_threshold: 644245094

stop_test_on_stress_failure: false


run_fullscan: ['{"mode": "partition", "ks_cf": "scylla_bench.test", "interval": 300, "pk_name":"pk", "rows_count": 200000, "validate_data": true}']

use_preinstalled_scylla: true

# To validate rows in partitions: collect data about partitions and their rows amount
# before and after running nemesis and compare it

# TODO: enable it back once https://github.com/scylladb/qa-tasks/issues/1578 is handled
#data_validation: |
#  validate_partitions: true
#  table_name: "scylla_bench.test"
#  primary_key_column: "pk"
#  max_partitions_in_test_table: 1000
#  partition_range_with_data_validation: 0-500
#  limit_rows_number: 10000


# Run a verification every 10 minutes:
run_tombstone_gc_verification: '{"ks_cf": "scylla_bench.test", "interval": 600, "propagation_delay_in_seconds": 300}'
