test_metadata:
  description: >-
    The canonical provisioning smoke test for SCT itself: a constraint-sized 3-node cluster with
    forced io-tune is preloaded with scylla-bench (with data validation), then runs a one-minute
    cassandra-stress write under a non-disruptive SisyphusMonkey. Used by the pull-request job and by
    the documented manual runs on every cloud backend.
  test_type: longevity
  tier: sanity
  duration_class: short
  supported_backends:
    - aws
    - gce
    - azure
    - xcloud
  stress_tools:
    - cassandra-stress
    - scylla-bench
  workload: write
  nemesis_labels:
    - SisyphusMonkey
  team_ownership: core-test-infra

test_duration: 60
data_validation: |
  validate_partitions: false
  table_name: "scylla_bench.test"
  primary_key_column: "pk"
  max_partitions_in_test_table: 10
  partition_range_with_data_validation: 0-5

stress_cmd: ["cassandra-stress write cl=QUORUM duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=1000 -pop seq=1..10000000 -log interval=5",
             ]

prepare_write_cmd:  ["scylla-bench -workload=sequential -mode=write -max-rate=300 -replication-factor=3 -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120 -concurrency=7 -rows-per-request=10",
                     "scylla-bench -workload=uniform -mode=read -replication-factor=3 -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120 -rows-per-request=10 -concurrency=7 -max-rate=32000 -duration=1m"
                    ]

n_loaders: 1
sizing_db:
  vcpu: '>=2'
  memory: '>=16.0'
# testing the force iotune feature
force_run_iotune: true
n_db_nodes: 3

nemesis_class_name: SisyphusMonkey
nemesis_selector: "not disruptive"
nemesis_interval: 1

user_prefix: 'PR-provision-test'
instance_provision: 'spot'

use_preinstalled_scylla: true
