test_metadata:
  description: >-
    Smallest Cassandra-to-ScyllaDB migration case: preloads 100K rows into a
    single-node Apache Cassandra 4.1 source cluster over CQL, replicates the source
    schema onto a single-node ScyllaDB target via dump_schema, then migrates the table
    with a spark-migrator job on a native Spark 4 EMR cluster (emr-spark-8.0.0) and
    checks the migrated row count. Provisions no loaders and skips the post-migration
    validator job, which makes it the quickest end-to-end check of the migrator path.
  test_type: spark-migrator
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  features: []
  team_ownership: core-test-infra

test_duration: 120

db_type: mixed_cassandra

# Scylla target cluster params
n_db_nodes: 1
sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 2
  memory: '>=16'

# Cassandra source cluster params
n_test_oracle_db_nodes: 1
sizing_db_oracle:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 2
  memory: '>=16'
  arch: x86_64
cassandra_oracle_version: '4.1'
ami_id_db_cassandra: 'resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'

# test preloads 100K rows via CQL directly
n_loaders: 0

n_monitor_nodes: 1

emr_release_label: 'emr-spark-8.0.0'
emr_instance_type_master: 'm5.xlarge'
emr_instance_type_core: 'm5.xlarge'
emr_instance_count_core: 1
emr_instance_count_task: 0
emr_applications:
  - 'Spark'
emr_keep_alive: true

emr_spark_migrator_release: 'v2.0.1'

migrator_source_keyspace: 'migrator_test'
migrator_source_table: 'source_table'
migrator_target_keyspace: 'migrator_test'
migrator_target_table: 'source_table'
migrator_run_validator: false

user_prefix: 'cs-to-sc-small'

run_commit_log_check_thread: false
