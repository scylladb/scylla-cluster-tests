test_metadata:
  description: >-
    Smoke test for the scylla-migrator plumbing: creates a small source table on a
    3-node ScyllaDB cluster, submits a spark-migrator job on an auxiliary EMR cluster
    to copy it into a target table on the same cluster, then verifies the migrated row
    count. Uses the legacy EMR path, where Spark 4.x is installed by a bootstrap action
    on an emr-7.x release, which keeps that fallback exercised alongside the native
    emr-spark-8.0.0 releases used by the cs-to-scylla configs.
  test_type: spark-migrator
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools: []
  features: []
  team_ownership: core-test-infra

test_duration: 120

n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 2
  memory: '>=16'

# legacy fallback: Spark 4.x installed via bootstrap on an emr-7.x release
emr_release_label: 'emr-7.12.0'
emr_install_spark4_via_bootstrap: true
emr_instance_type_master: 'm5.xlarge'
emr_instance_type_core: 'm5.xlarge'
emr_instance_count_core: 2
emr_instance_count_task: 0
emr_applications:
  - 'Spark'
emr_keep_alive: true

emr_spark_migrator_release: 'v2.0.0'

user_prefix: 'spark-migrator-basic'

argus_email_report_template: 'email_report_spark_migrator.yaml'

post_behavior_db_nodes: 'destroy'
post_behavior_loader_nodes: 'destroy'
post_behavior_monitor_nodes: 'destroy'
post_behavior_emr_cluster: 'destroy'
