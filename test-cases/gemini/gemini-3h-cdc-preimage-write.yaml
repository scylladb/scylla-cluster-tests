test_duration: 300
n_db_nodes: 3
n_loaders: 1
instance_type_db: 'i7i.4xlarge'
instance_type_loader: 'm7i.xlarge'
user_prefix: 'gemini-cdc-preimage-write'

gemini_cmd: |
  --duration 3h
  --mode mixed
  --mutation-concurrency 24
  --read-concurrency 6
  --max-deleted-heap-size 2000000

gemini_table_options:
  - "cdc={'enabled': true, 'preimage': true}"
gemini_log_cql_statements: true

db_type: scylla
