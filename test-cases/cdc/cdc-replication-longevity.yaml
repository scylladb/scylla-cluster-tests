test_duration: 900

user_prefix: 'cdc-replication-longevity'
db_type: mixed_scylla

n_db_nodes: 3
instance_type_db: 'i4i.large'

n_test_oracle_db_nodes: 1
instance_type_db_oracle: 'i8g.large'

n_loaders: 1
instance_type_loader: 'c6i.large'


nemesis:
  runners:
    - CategoricalMonkey:
        dist:
          nodetool_decommission: 5
          terminate_and_replace_node: 5
          grow_shrink_cluster: 5
          remove_node_then_add_node: 5
          decommission_streaming_err: 5
          network_random_interruptions: 4
          # network_block: 2  # disabled due to #2745
          # network_start_stop_interface: 2  # as above
          stop_wait_start_scylla_server: 1
          stop_start_scylla_server: 1
          restart_then_repair_node: 1
          hard_reboot_node: 1
          multiple_hard_reboot_node: 1
          soft_reboot_node: 1
          restart_with_resharding: 1
          destroy_data_then_repair: 1
          destroy_data_then_rebuild: 1
          nodetool_drain: 1
          kill_scylla: 1
          no_corrupt_repair: 1
          major_compaction: 1
          nodetool_refresh: 1
          nodetool_enospc: 1
          truncate: 1
          truncate_large_partition: 1
          abort_repair: 1
          snapshot_operations: 1
          rebuild_streaming_err: 1
          repair_streaming_err: 1
          memory_stress: 1
        default_weight: 0

extra_network_interface: True

gemini_cmd: |
  --duration 30m
  --concurrency 4
  --mode write
  --cql-features basic
  --max-mutation-retries 100
  --max-mutation-retries-backoff 100ms

gemini_table_options:
  - "cdc = {'enabled': true, 'ttl': 0}"
