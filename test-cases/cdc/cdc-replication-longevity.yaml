test_duration: 900

user_prefix: 'cdc-replication-longevity'
db_type: mixed_scylla

n_db_nodes: 3
instance_type_db: 'i4i.large'

n_test_oracle_db_nodes: 1
instance_type_db_oracle: 'i8g.large'

n_loaders: 1
instance_type_loader: 'c6i.large'


nemesis:
  runners:
    - CategoricalMonkey:
        dist:
          DecommissionMonkey: 5
          NodeTerminateAndReplace: 5
          GrowShrinkClusterNemesis: 5
          TerminateAndRemoveNodeMonkey: 5
          DecommissionStreamingErrMonkey: 5
          RandomInterruptionNetworkMonkey: 4
          # BlockNetworkMonkey: 2  # disabled due to #2745
          # StopStartInterfacesNetworkMonkey: 2  # as above
          StopWaitStartMonkey: 1
          StopStartMonkey: 1
          RestartThenRepairNodeMonkey: 1
          HardRebootNodeMonkey: 1
          MultipleHardRebootNodeMonkey: 1
          SoftRebootNodeMonkey: 1
          NodeRestartWithResharding: 1
          CorruptThenRepairMonkey: 1
          CorruptThenRebuildMonkey: 1
          DrainerMonkey: 1
          ScyllaKillMonkey: 1
          NoCorruptRepairMonkey: 1
          MajorCompactionMonkey: 1
          RefreshMonkey: 1
          EnospcMonkey: 1
          TruncateMonkey: 1
          TruncateLargeParititionMonkey: 1
          AbortRepairMonkey: 1
          SnapshotOperations: 1
          RebuildStreamingErrMonkey: 1
          RepairStreamingErrMonkey: 1
          MemoryStressMonkey: 1
        default_weight: 0

extra_network_interface: True

gemini_cmd: |
  --duration 30m
  --concurrency 4
  --mode write
  --cql-features basic
  --max-mutation-retries 100
  --max-mutation-retries-backoff 100ms

gemini_table_options:
  - "cdc = {'enabled': true, 'ttl': 0}"
