test_metadata:
  description: >-
    Cluster-growth scale test: a 15-node cluster gets a dataset of 50M rows of 1KB (about 50GB), then a
    cassandra-stress write load, a read load over that dataset and SisyphusMonkey start, and the
    cluster is grown towards a target size in batches while they run, with fullscans throughout.
    The loads then run for one more round on the full-size cluster.
    The dataset is moderate on purpose: these jobs test the number of nodes (topology changes, schema
    and gossip at scale, under load and nemesis), not the data volume. Bootstrap that streams a large
    dataset is left to the large-dataset longevity tests, whose nemeses add and replace nodes.
    Parameterised by the pipelines into the 15-25, 40-60, 180-200 and 450-500 node growth jobs.
  test_type: scale
  tier: tier2
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  team_ownership: core-test-infra

test_duration: 600
# 50M rows of 1KB (1 column * 1024B), about 50GB: 25M rows from each of the two loaders.
prepare_write_cmd:  [ "cassandra-stress write cl=ALL n=25000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=1..25000000         -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5",
                      "cassandra-stress write cl=ALL n=25000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=25000001..50000000  -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5"
                    ]

# Started right before the cluster grows (see grow_cluster_during_stress): one loader writes over
# 1..100M (overwriting the 50M prepared rows and adding 50M more), the other reads back the 50M
# prepared rows. Both are run again each time they end before the cluster reaches
# cluster_target_size, and once more after it, on the full-size cluster.
stress_cmd: [ "cassandra-stress write cl=QUORUM duration=10m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=1..100000000 -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5",
              "cassandra-stress read cl=QUORUM duration=10m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=1..50000000   -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5"
             ]

round_robin: true
grow_cluster_during_stress: true

n_db_nodes: 15
add_node_cnt: 5
cluster_target_size: 25
n_loaders: 2

sizing_db:  # no OCI match (DenseIO min 16 vCPUs)
  vcpu: 2
  memory: '>=16'
  arch: x86_64
instance_provision_fallback_on_demand: false
# Scale tests provision very large clusters (100+ nodes) and want the region fixed and
# controlled rather than silently relocated. AZ-level fallback within the configured region
# is unaffected. Region relocation on this scale is also what exceeded the fixed Jenkins
# "Provision Resources" stage timeout in the SCT-779 incident, but that leak class is now
# handled independently of this setting by tagging Spot Fleet Requests for cleanup.
fallback_to_next_region: false

run_fullscan: ['{"mode": "table_and_aggregate", "ks_cf": "keyspace1.standard1", "interval": 10}']

nemesis_class_name: 'SisyphusMonkey'
nemesis_during_prepare: false

user_prefix: 'cluster-base-scale-test'

use_preinstalled_scylla: true

internode_compression: 'all'
