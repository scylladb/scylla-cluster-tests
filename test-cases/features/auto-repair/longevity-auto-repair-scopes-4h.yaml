test_metadata:
  description: >-
    Automatic Repair MS2 scopes under a basic 4-hour longevity: ALTER CLUSTER enables auto repair with
    a 15-minute period, ALTER KEYSPACE turns it off for ks_manual and ALTER TABLE for ks_mixed.manual_t,
    while ks_auto.t and ks_mixed.auto_t follow the cluster value. latte keeps inserting, deleting 20% of
    the keys and validating reads on all four tables under SisyphusMonkey. Auto repair per scope is
    checked offline from the "Finished tablet repair ... request_type=auto_repair" DB log lines, with
    table ids mapped to names through system_tablets.log.
  test_type: features
  tier: ondemand
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - latte
  workload: mixed
  nemesis_labels:
    - SisyphusMonkey
  features:
    - tablets
  team_ownership: storage-qa

# Maintained by Storage QA
# Scenario 2 of the Automatic Repair MS2 test plan (https://scylladb.atlassian.net/wiki/x/CwBlHg),
# without the concurrent Scylla Manager repair
test_duration: 330

n_db_nodes: 6
n_loaders: 1
sizing_db:
  vcpu: 2
  memory: '>=16'

nemesis_class_name: 'SisyphusMonkey'
nemesis_interval: 5
# the prepare writes at CL=ALL
nemesis_during_prepare: false

user_prefix: 'longevity-auto-repair-scopes-4h'

# The narrowest scope that stores a value wins:
#   ks_auto.t          follows the cluster value: auto repair every 15 minutes
#   ks_manual.t        keyspace scope false: no auto repair
#   ks_mixed.auto_t    follows the cluster value: auto repair every 15 minutes
#   ks_mixed.manual_t  table scope false: no auto repair
# Auto repair is enabled at CLUSTER scope last: a never-repaired tablet is eligible right away, so
# enabling it first would repair ks_manual.t and ks_mixed.manual_t before their own scopes are set
pre_create_keyspace:
  - "CREATE KEYSPACE ks_auto WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'enabled': true}"
  - "CREATE KEYSPACE ks_manual WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'enabled': true}"
  - "CREATE KEYSPACE ks_mixed WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND tablets = {'enabled': true}"
  - "CREATE TABLE ks_auto.t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"
  - "CREATE TABLE ks_manual.t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"
  - "CREATE TABLE ks_mixed.auto_t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"
  - "CREATE TABLE ks_mixed.manual_t (pk bigint, ck bigint, PRIMARY KEY (pk, ck))"
  - "ALTER KEYSPACE ks_manual WITH auto_repair_enabled = false"
  - "ALTER TABLE ks_mixed.manual_t WITH auto_repair_enabled = false"
  - "ALTER CLUSTER WITH auto_repair_threshold_in_seconds = 900"
  - "ALTER CLUSTER WITH auto_repair_enabled = true"

# 'latte schema' runs once per script: point it at an existing table, so it creates nothing
latte_schema_parameters:
  keyspace: 'ks_auto'
  table: 't'

stress_template_context:
  # 2M keys per table: keys 1600001-1999999 (20%) are deleted, the rest inserted, and reads validate both
  keys: "-P row_count=2000000 -P delete_start_index=1600001 -P delete_end_index=2000000 --threads=2 --concurrency=64"
  main: "--consistency=QUORUM --duration=240m --rate=2000 --retry-number=10 --retry-interval=500ms,5s --request-timeout=30s --validation-strategy=retry"

prepare_write_cmd:
  - >-
    latte run --tag prepare-ks-auto-t -f insert_or_delete --consistency=ALL -d 2000000 {{ keys }}
    -P keyspace=\"ks_auto\" -P table=\"t\" data_dir/latte/validation.rn
  - >-
    latte run --tag prepare-ks-manual-t -f insert_or_delete --consistency=ALL -d 2000000 {{ keys }}
    -P keyspace=\"ks_manual\" -P table=\"t\" data_dir/latte/validation.rn
  - >-
    latte run --tag prepare-ks-mixed-auto-t -f insert_or_delete --consistency=ALL -d 2000000 {{ keys }}
    -P keyspace=\"ks_mixed\" -P table=\"auto_t\" data_dir/latte/validation.rn
  - >-
    latte run --tag prepare-ks-mixed-manual-t -f insert_or_delete --consistency=ALL -d 2000000 {{ keys }}
    -P keyspace=\"ks_mixed\" -P table=\"manual_t\" data_dir/latte/validation.rn

stress_cmd:
  - >-
    latte run --tag ks-auto-t -f insert_or_delete:1 -f get:1 {{ main }} {{ keys }}
    -P keyspace=\"ks_auto\" -P table=\"t\" data_dir/latte/validation.rn
  - >-
    latte run --tag ks-manual-t -f insert_or_delete:1 -f get:1 {{ main }} {{ keys }}
    -P keyspace=\"ks_manual\" -P table=\"t\" data_dir/latte/validation.rn
  - >-
    latte run --tag ks-mixed-auto-t -f insert_or_delete:1 -f get:1 {{ main }} {{ keys }}
    -P keyspace=\"ks_mixed\" -P table=\"auto_t\" data_dir/latte/validation.rn
  - >-
    latte run --tag ks-mixed-manual-t -f insert_or_delete:1 -f get:1 {{ main }} {{ keys }}
    -P keyspace=\"ks_mixed\" -P table=\"manual_t\" data_dir/latte/validation.rn
