test_metadata:
  description: >-
    Short test that adds and removes LDAP role permissions on a 3-node cluster with an OpenLDAP server
    and LDAP authorization. Runs a light cassandra-stress write at QUORUM to check that Scylla applies
    each permission change.
  test_type: features
  tier: tier2
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  workload: write
  features:
    - authorization
  team_ownership: core-qa

test_duration: 120

use_ldap: true
ldap_server_type: 'openldap'
use_ldap_authorization: true

n_db_nodes: 3
n_loaders: 1
instance_type_db: 'i4i.large'
user_prefix: 'test-add-remove-ldap-permissions'
stress_cmd: "cassandra-stress write no-warmup cl=QUORUM duration=10m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=2 -pop seq=1..1002003 -log interval=5"
