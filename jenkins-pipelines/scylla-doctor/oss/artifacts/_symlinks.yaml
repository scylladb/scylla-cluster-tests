# Pipeline symlinks for scylla-doctor release gating.
# These create Jenkins jobs in the scylla-doctor folder that reference
# artifact test pipelines from oss/artifacts/, avoiding file duplication.
#
# See utils/build_system/create_test_release_jobs.py::process_symlinks for details.

symlinks:
  - name: "artifacts-ami"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ami.jenkinsfile"
  - name: "artifacts-ami-arm"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ami-arm.jenkinsfile"
  - name: "artifacts-docker"
    target: "jenkins-pipelines/oss/artifacts/artifacts-docker.jenkinsfile"
  - name: "artifacts-ubuntu2404"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ubuntu2404.jenkinsfile"
  - name: "artifacts-rhel10"
    target: "jenkins-pipelines/oss/artifacts/artifacts-rhel10.jenkinsfile"
  - name: "artifacts-centos9"
    target: "jenkins-pipelines/oss/artifacts/artifacts-centos9.jenkinsfile"
  - name: "artifacts-rocky9"
    target: "jenkins-pipelines/oss/artifacts/artifacts-rocky9.jenkinsfile"
  - name: "artifacts-debian12"
    target: "jenkins-pipelines/oss/artifacts/artifacts-debian12.jenkinsfile"
  - name: "artifacts-ubuntu2204"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ubuntu2204.jenkinsfile"
  - name: "artifacts-amazon2023"
    target: "jenkins-pipelines/oss/artifacts/artifacts-amazon2023.jenkinsfile"
  - name: "artifacts-amazon2023-arm"
    target: "jenkins-pipelines/oss/artifacts/artifacts-amazon2023-arm.jenkinsfile"
  - name: "artifacts-centos9-arm"
    target: "jenkins-pipelines/oss/artifacts/artifacts-centos9-arm.jenkinsfile"
  - name: "artifacts-ubuntu2204-arm"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ubuntu2204-arm.jenkinsfile"
  - name: "artifacts-ubuntu2404-arm"
    target: "jenkins-pipelines/oss/artifacts/artifacts-ubuntu2404-arm.jenkinsfile"
