# SCT-1215: test-cases/PR-provision-test.yaml cut to one DB node, on the baremetal backend, with one
# host listed as both loader and monitor in the hosts config. The DB node is reached over its
# public IP, so SCT and the loader/monitor host can sit outside its network (e.g. a lab host).
cluster_backend: baremetal
s3_baremetal_config: baremetal_sct1215_monster
user_credentials_path: '~/.ssh/scylla_test_id_ed25519'
# The DB node only: the hosts config sets `private` for monster, which sits next to SCT and needs no tunnels
ip_ssh_connections: public
# Scylla advertises the public IP, so the driver on the loader host gets a reachable address
intra_node_comm_public: true
use_preinstalled_scylla: false
use_mgmt: false

n_db_nodes: 1
n_loaders: 1
n_monitor_nodes: 1
simulated_racks: 0

# One node leaves no non-disruptive nemesis worth running
nemesis_class_name: NoOpMonkey

user_prefix: 'sct1215-shared-host'

# PR-provision-test with RF=1 and CL=ONE; gemini dropped, it needs an oracle cluster
pre_create_keyspace: [
  "CREATE KEYSPACE IF NOT EXISTS ycsb WITH REPLICATION = {'class' : 'NetworkTopologyStrategy', 'replication_factor': 1 };",
  "CREATE TABLE IF NOT EXISTS ycsb.usertable (y_id varchar primary key, field0 varchar, field1 varchar, field2 varchar, field3 varchar, field4 varchar, field5 varchar, field6 varchar, field7 varchar, field8 varchar, field9 varchar);"
]

prepare_write_cmd: ["scylla-bench -workload=sequential -mode=write -max-rate=300 -replication-factor=1 -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120 -concurrency=7 -rows-per-request=10",
                    "scylla-bench -workload=uniform -mode=read -replication-factor=1 -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120 -rows-per-request=10 -concurrency=7 -max-rate=32000 -duration=1m",
                    "bin/ycsb load scylla -P workloads/workloada -threads 10 -p recordcount=5000 -p scylla.readconsistencylevel=ONE -p scylla.writeconsistencylevel=ONE -p fieldcount=10 -p fieldlength=128 -p insertstart=0 -p insertcount=5000"
                   ]

stress_cmd: ["cassandra-stress write cl=ONE duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=1000 -pop seq=1..10000000 -log interval=5",
             "cql-stress-cassandra-stress write cl=ONE duration=1m -schema 'keyspace=cqlstress replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=200 -pop seq=1..1000000 -log interval=5",
             "latte run --function insert --consistency ONE --duration 1m --threads 2 --concurrency 32 --rate 1000 -P row_count=100000 -P replication_factor=1 data_dir/latte/validation.rn",
            ]

# `latte schema` takes only these, not the -P flags of the `latte run` line
latte_schema_parameters:
  replication_factor: 1
