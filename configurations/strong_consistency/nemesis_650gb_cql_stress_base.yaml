# Shared, consistency-agnostic settings for the "latency during topology operations" jobs that drive
# the 650GB dataset with cql-stress-cassandra-stress instead of cassandra-stress.
#
# Stacked on top of test-cases/performance/perf-regression-latency-650gb-with-nemesis.yaml, which it
# overrides, and kept free of anything SC/EC- or architecture-specific so that all four jobs
# (i4i/i8g x SC/EC) share exactly the same loader shape and NemesisSequence steps.
#
# Loader sizing: the workload fragments ask for 250 connections per shard per loader, so with
# 4 loaders every db shard accepts 1000 connections in aggregate. Against a 4xlarge db node
# (16 vCPU -> 15 shards) that is 3750 connections held open by each loader, far beyond what the
# c5.2xlarge of the base test-case can drive - hence c7i.8xlarge, the same loader the SC gradual
# throughput jobs use (test-cases/performance/perf-regression-predefined-throughput-steps.yaml).

n_loaders: 4
instance_type_loader: 'c7i.8xlarge'

# cql-stress always runs in a docker container on the loader
use_prepared_loaders: false
round_robin: true

user_prefix: 'perf-lat-nemesis-cqls'
email_subject_postfix: 'latency during topology operations'

# configurations/disable_speculative_retry.yaml, which these jobs stack earlier in the chain, ALTERs
# three tables (keyspace1.standard1, scylla_bench.test, custom_d3_w1.table1). That list is safe only
# for the gradual-throughput test class, which filters it down to its own keyspace in
# run_post_prepare_cql() before executing. PerformanceRegressionTest.preload_data() runs every command
# as-is, so narrow the list to the only table these jobs create - otherwise the run dies with
# "Keyspace scylla_bench does not exist" right after the population phase.
post_prepare_cql_cmds: ["ALTER TABLE keyspace1.standard1 WITH speculative_retry = 'NONE'"]

# NemesisSequence steps skipped by all four jobs. SC cannot run them yet, and EC skips them too so both
# run the same sequence (steady state, grow, shrink) and stay comparable step for step:
# - Scylla Manager repair: repairing SC tablets fails every request to them and kills the load
#   (SCYLLADB-4854).
# - terminate and replace: the replacing node needs a new replica of every SC tablet it held, which
#   never catches up while transfer_snapshot() is not implemented (SCYLLADB-4753); the node never
#   comes up and the run hangs for 8h.
use_mgmt: false
nemesis_sequence_skip_terminate_and_replace: true
