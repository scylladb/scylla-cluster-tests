  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=125 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=2500001..5000000",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=125 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=5000001..7500000",
