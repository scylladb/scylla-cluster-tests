  "cql-stress-cassandra-stress read  cl=QUORUM n=3333334 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=3333335..6666668",
