prepare_stress_cmd: []
pre_create_keyspace: ["CREATE KEYSPACE keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} and consistency = 'global' and tablets = {'enabled': true};"]

# round_robin runs one command per loader: every command list below has exactly n_loaders entries.
# 4x c7i.24xlarge (96 vCPU each) give the same 384 loader vCPUs as 12x c7i.8xlarge, and
# 1860 read threads per loader keep the same 7440 in-flight requests in total.
# connectionsPerShard adds up to 1000 per shard over all loaders (4 x 250).
# Prepare writes at 240k/s in total (4 x 60000/s), about 80% of the SC i8g unthrottled write
# ceiling (~294k op/s at cl=QUORUM), so the 650M keys load in ~45 min.
n_loaders: 4
instance_type_loader: 'c7i.24xlarge'
perf_gradual_threads: {"read": 1860}
perf_gradual_throttle_steps: {"read": ['unthrottled']}

prepare_write_cmd: [
    "cql-stress-cassandra-stress write  cl=QUORUM n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=600 throttle=60000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=1..162500001",
    "cql-stress-cassandra-stress write  cl=QUORUM n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=600 throttle=60000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=162500002..325000002",
    "cql-stress-cassandra-stress write  cl=QUORUM n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=600 throttle=60000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=325000003..487500003",
    "cql-stress-cassandra-stress write  cl=QUORUM n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=600 throttle=60000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=487500004..650000004"
]

stress_cmd_r: [
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..5000000",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=5000001..10000000",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000001..15000000",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=15000001..20000000"
]

stress_cmd_cache_warmup: [
  "cql-stress-cassandra-stress read  cl=QUORUM n=5000000 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..5000000",
  "cql-stress-cassandra-stress read  cl=QUORUM n=5000000 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=5000001..10000000",
  "cql-stress-cassandra-stress read  cl=QUORUM n=5000000 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000001..15000000",
  "cql-stress-cassandra-stress read  cl=QUORUM n=5000000 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=15000001..20000000"
]
