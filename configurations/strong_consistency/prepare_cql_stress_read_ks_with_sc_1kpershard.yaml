prepare_stress_cmd: []
pre_create_keyspace: ["CREATE KEYSPACE keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} and consistency = 'global' and tablets = {'enabled': true};"]

# round_robin runs one command per loader: every command list below has exactly n_loaders entries.
# Same 650M-key dataset and 20M-key read set as with 4 loaders, re-split into 12 ranges.
# connectionsPerShard adds up to 1000 per shard over all loaders (4 x 84 + 8 x 83).
n_loaders: 12
perf_gradual_throttle_steps: {"read": ['unthrottled']}

prepare_write_cmd: [
    "cql-stress-cassandra-stress write  cl=QUORUM n=54166667 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=84 cql3 native -rate threads=50 throttle=12500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=1..54166667",
    "cql-stress-cassandra-stress write  cl=QUORUM n=54166667 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=84 cql3 native -rate threads=50 throttle=12500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=54166668..108333334",
