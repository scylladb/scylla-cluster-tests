prepare_stress_cmd: []
pre_create_keyspace: [
  "CREATE KEYSPACE keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} and consistency = 'global' and tablets = {'enabled': true, 'initial': 45};",
  "CREATE TABLE IF NOT EXISTS keyspace1.standard1 (key blob PRIMARY KEY, \"C0\" blob) WITH compression = {} AND tablets = {'pow2_count': false};"
]

# round_robin runs one command per loader: every command list below has exactly n_loaders entries.
# Same loaders, read threads (perf_gradual_threads default, 620 x 6 = 3720 in flight), connections
# (250 per shard per loader, 1500 in total) and key ranges as the EC read job: only the
# consistency mode and the tablet layout differ.
# 45 initial tablets, one per shard (3 x i8g.4xlarge = 45 shards), so the Raft leaders can spread
# at most one per shard. The table is pre-created with pow2_count false, otherwise Scylla rounds 45
# up to 64; cql-stress creates standard1 with IF NOT EXISTS and no compression, so it keeps this one.
# Prepare and cache warmup use QUORUM, not ALL. Prepare writes at 240k/s in total (6 x 40000/s),
# about 80% of the SC i8g unthrottled write ceiling (~294k op/s at cl=QUORUM), so the 650M keys
# load in ~45 min.
n_loaders: 6
perf_gradual_throttle_steps: {"read": ['unthrottled']}

prepare_write_cmd: [
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=1..108333334",
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=108333335..216666668",
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=216666669..325000002",
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=325000003..433333336",
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=433333337..541666670",
    "cql-stress-cassandra-stress write  cl=QUORUM n=108333334 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerShard=250 cql3 native -rate threads=400 throttle=40000/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=541666671..650000004"
]

stress_cmd_r: [
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..3333334",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=3333335..6666668",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=6666669..10000001",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000002..13333334",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=13333335..16666667",
  "cql-stress-cassandra-stress read  cl=QUORUM duration=$duration -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads $throttle' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=16666668..20000000"
]

stress_cmd_cache_warmup: [
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333334 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..3333334",
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333334 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=3333335..6666668",
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333333 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=6666669..10000001",
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333333 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000002..13333334",
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333333 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=13333335..16666667",
  "cql-stress-cassandra-stress read  cl=QUORUM n=3333333 -mode connectionsPerShard=250 cql3 native -rate 'threads=$threads' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=16666668..20000000"
]
