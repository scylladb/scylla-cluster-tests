# 120min for 180 nodes creation + 240min for add 20 new nodes + 240min of margin. After the cluster
# reaches its target size, the test runs one more stress_cmd round (10min) on it, and more rounds
# until minimum_nemesis_to_execute nemeses were executed.
test_duration: 600
n_db_nodes: 180
cluster_target_size: 200
add_node_cnt: 20
minimum_nemesis_to_execute: 3

user_prefix: 'cluster-scale-180-200-test'

# Takes too long on big clusters
cluster_health_check: false
use_scylla_doctor_on_failure: false

backtrace_decoding: false
