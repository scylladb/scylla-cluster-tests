# One hour from the end of the cluster setup: the prepare, the growth to 200 nodes and the stress_cmd rounds.
# After the cluster reaches its target size, the test runs one more stress_cmd round (10min) on it, and
# more rounds until minimum_nemesis_to_execute nemeses were executed. An extra round is started only
# while a full one still fits in the test_duration, so this is also what bounds the extra rounds.
test_duration: 60
n_db_nodes: 180
cluster_target_size: 200
add_node_cnt: 20
minimum_nemesis_to_execute: 3

user_prefix: 'cluster-scale-180-200-test'

# Takes too long on big clusters
cluster_health_check: false
use_scylla_doctor_on_failure: false

backtrace_decoding: false
