# One hour from the end of the cluster setup: the prepare, the growth to 500 nodes and the stress_cmd rounds.
# After the cluster reaches its target size, the test runs one more stress_cmd round (10min) on it, and
# more rounds until minimum_nemesis_to_execute nemeses were executed. An extra round is started only
# while a full one still fits in the test_duration, so this is also what bounds the extra rounds.
test_duration: 60
n_db_nodes: 450
cluster_target_size: 500
add_node_cnt: 50
minimum_nemesis_to_execute: 3

user_prefix: 'cluster-scale-450-500-test'

# The sct-runner holds a live remoter (SSH session + background log threads) per node, so
# memory scales with cluster size. The default runner (m7i-flex.xlarge, 16G) is already
# OOM-killed at 180 nodes, so use a memory-optimized runner sized for 450-500 nodes.
instance_type_runner: 'r6i.4xlarge'  # 16 vcpus, 128G

# Takes too long on big clusters
cluster_health_check: false
use_scylla_doctor_on_failure: false

backtrace_decoding: false
