write_stress_during_entire_test: cql-stress-cassandra-stress write no-warmup cl=QUORUM n=20100200 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate threads=100 -pop seq=1..20100200 -log interval=5
verify_stress_after_cluster_upgrade: cql-stress-cassandra-stress read no-warmup cl=QUORUM n=20100200 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate threads=1000 -pop seq=1..20100200 -log interval=5
# Preload/validation workload that runs BEFORE any nodes are upgraded.
# The first command is the standard prepare write stress, the second is scylla-bench using CL=ALL
# to ensure data is correctly written on all nodes before upgrade starts.
# This guarantees we can validate data later without ambiguity about whether issues
# occurred during preload or during the test itself.
prepare_write_stress:
  - cql-stress-cassandra-stress write no-warmup cl=QUORUM n=10100200 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native compression=lz4 -rate threads=1000 -pop seq=1..10100200 -log interval=5
  - scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=5 -connection-count=5 -consistency-level=all -rows-per-request=10 -timeout=30s -validate-data
stress_cmd_read_cl_quorum: cql-stress-cassandra-stress read no-warmup cl=QUORUM n=10100200 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=DeflateCompressor' -mode cql3 native compression=none -rate 'threads=1000 throttle=60000/s' -pop seq=1..10100200 -log interval=5
stress_cmd_read_10m: cql-stress-cassandra-stress read no-warmup cl=QUORUM duration=10m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=SnappyCompressor' -mode cql3 native compression=snappy -rate 'threads=1000 throttle=60000/s' -pop seq=1..10100200 -log interval=5
stress_cmd_read_60m: cql-stress-cassandra-stress read no-warmup cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compression=LZ4Compressor' -mode cql3 native compression=lz4 -rate 'threads=1000 throttle=60000/s' -pop seq=1..10100200 -log interval=5
stress_cmd_complex_prepare: latte run data_dir/latte/complex_schema.rn -f insert --consistency ALL -d 5000000 -P row_count=5000000 --threads 8 --concurrency 128
stress_cmd_complex_verify_read: latte run data_dir/latte/complex_schema.rn -f read_by_key:1 -f read_by_email:1 --consistency ONE -d 5000000 -P row_count=5000000 --threads 8 --concurrency 128 -r 60000 --validation-strategy=retry
stress_cmd_complex_verify_more: latte run data_dir/latte/complex_schema.rn -f read_by_key:1 -f read_by_ck:1 -f read_by_email:1 -f update_static:1 -f update_ttl:1 -f update_diff1_ts:1 -f update_diff2_ts:1 -f update_same1_ts:1 -f update_same2_ts:1 --consistency ALL -d 5000000 -P row_count=5000000 --threads 8 --concurrency 64 -r 60000 --validation-strategy=retry
stress_cmd_complex_verify_delete: latte run data_dir/latte/complex_schema.rn -f delete_row --consistency ALL -d 500000 -P row_count=5000000 --threads 8 --concurrency 64 -r 60000
# Large partition workload that runs DURING rolling upgrade while nodes are being upgraded.
# Uses CL=QUORUM (NOT CL=ALL) because not all nodes may be available during upgrade.
# This tests cluster behavior with large partitions under load during the upgrade process.
large_partition_stress_during_upgrade: scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=5 -connection-count=5 -consistency-level=quorum -rows-per-request=10 -timeout=30s -validate-data -keyspace scylla_bench_during_upgrade
stress_before_upgrade: scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=5 -connection-count=5 -consistency-level=quorum -rows-per-request=10 -timeout=30s -validate-data
stress_after_cluster_upgrade: scylla-bench -workload=sequential -mode=read -replication-factor=3 -partition-count=800 -clustering-row-count=5555 -clustering-row-size=uniform:100..1024 -concurrency=20 -connection-count=20 -consistency-level=one -rows-per-request=100 -timeout=30s -validate-data

azure_region_name: 'eastus'
azure_instance_type_db: 'Standard_L8s_v3'
azure_image_db: ''
internode_compression: 'all'
