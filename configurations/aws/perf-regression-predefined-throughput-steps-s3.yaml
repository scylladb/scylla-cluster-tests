# AWS + S3 for test-cases/performance/perf-regression-predefined-throughput-steps-object-storage.yaml.
# Use with configurations/object_storage_s3.yaml; the endpoint below must match its object_storage_endpoints name, and the
# bucket must be in the same region (us-east-1).
pre_create_keyspace: [
  "CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': '3'} AND storage = {'type': 'S3', 'bucket': 'manager-backup-tests-us-east-1', 'endpoint': 's3.us-east-1.amazonaws.com'};",
]

instance_type_db: 'r8gd.2xlarge'
instance_type_loader: 'c7i.2xlarge'
instance_type_monitor: 't3.small'

use_capacity_reservation: true
use_placement_group: true
