# Shrinks test-cases/scale/scale-cluster.yaml to something a single host can run under minicloud,
# for grow_cluster_test.GrowClusterTest.test_grow_x_to_y. Layer all three, in this order:
#
#   -c test-cases/scale/scale-cluster.yaml \
#   -c configurations/minicloud/scale-cluster.yaml \
#   -c configurations/minicloud.yaml
#
# What survives the shrink is the *shape* of the test: a cluster that grows one node at a time
# under load, with a nemesis afterwards. What does not survive is the scale. The production test is
# 15 db nodes growing to 25; at minicloud_lightweight_memory that peak is 28 guests x 4GiB = 112GiB
# of RAM, which no single host has. So this exercises the grow path - bootstrap, streaming,
# reconfiguring monitoring, reaching cluster_target_size - and nothing about behaviour at scale.
# Do not read performance or scalability conclusions off a local run.
#
# Guest budget at the peak: 4 db + 1 loader + 1 monitor = 6 guests x 4GiB = 24GiB, plus ~2GiB host
# headroom. The preflight gate counts cluster_target_size rather than n_db_nodes, so it blocks up
# front instead of at the moment the cluster grows.
#
# To go bigger on a bigger host, override the counts rather than editing this file:
#   SCT_N_DB_NODES=5 SCT_CLUSTER_TARGET_SIZE=8 scripts/run-minicloud-test.sh -f scale
# and remember every added node costs another minicloud_lightweight_memory.
#
# NOTE on which keys matter here: test_grow_x_to_y calls GrowClusterTest.get_stress_cmd(), which
# *builds* its cassandra-stress command from cassandra_stress_population_size,
# cassandra_stress_threads and test_duration. It never reads the base test-case's stress_cmd or
# prepare_write_cmd, and run_fullscan is only wired up in longevity_test - so shrinking those here
# would be dead configuration. The three params below are the ones that actually size the load.

# 3 is the floor that keeps RF=3 satisfiable while the nemesis takes a node out; growing by one is
# enough to exercise the whole add-node path end to end.
n_db_nodes: 3
add_node_cnt: 1
cluster_target_size: 4
n_loaders: 1
# Not optional: add_nodes() calls monitors.reconfigure_scylla_monitoring() after every node, and
# setUp() builds a prometheus metrics object for the add_node timing.
n_monitor_nodes: 1

# What get_stress_cmd() interpolates. The defaults are 1M rows at 1000 threads, which a 1-vCPU
# guest cannot serve - and the command runs for test_duration minutes, so this also decides how
# long a local run takes.
cassandra_stress_population_size: 50000
cassandra_stress_threads: 10
test_duration: 60

# Lightweight mode caps every guest to 1 vCPU / minicloud_lightweight_memory regardless of the
# type, so these only have to exist in the emulated catalogs.
instance_type_db: 'i4i.large'
instance_type_loader: 'i4i.large'
gce_instance_type_db: 'n2-standard-2'
gce_instance_type_loader: 'n2-standard-2'
gce_instance_type_monitor: 'n2-standard-2'
# qcow2-backed disks, no NVMe passthrough - the base test-case asks for 2 local SSDs, which the
# emulated GCE path cannot serve.
gce_n_local_ssd_disk_db: 1

# Nested virtualization for the QEMU guests, and RAM for the 24GiB peak above. AWS: only
# c8i/m8i/r8i support it; m8i.2xlarge is 32GiB, which leaves little room - use m8i.4xlarge if you
# raise the node counts.
instance_type_runner: 'm8i.2xlarge'

user_prefix: 'minicloud-scale-test'

# grow_cluster() starts the nemesis only after the cluster has reached its target size.
# Non-disruptive only: a 4-node cluster losing a node is a different test, and one the emulated
# path cannot tell apart from a real fault.
nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'not disruptive'
nemesis_interval: 5
nemesis_during_prepare: false
