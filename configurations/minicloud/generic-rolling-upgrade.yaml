# Minicloud adaptation of the OS rolling-upgrade scenario for AWS.
# Based on test-cases/upgrades/generic-rolling-upgrade.yaml, with Ubuntu 24.04 + deb-installed
# base version and smaller workloads for 1-vCPU guests.

ami_id_db_scylla: 'resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
ami_db_scylla_user: 'ubuntu'
scylla_linux_distro: 'ubuntu-noble'

instance_type_db: 'i4i.large'
# nested virtualization for the QEMU guests, when the run is executed on a cloud sct-runner
instance_type_runner: 'm8i.2xlarge'

num_nodes_to_rollback: 1

# apt dist-upgrade of the stock image exercises Canonical mirrors, not the upgrade path (at ~15 min per 1-vCPU guest)
upgrade_node_system: false

user_prefix: 'minicloud-generic-upgrade'

# simplified production workloads (data volume and thread counts are reduced)
stress_before_upgrade: "cassandra-stress write no-warmup cl=QUORUM n=100000 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=10 -pop seq=1..100000 -col 'n=FIXED(10) size=FIXED(512)' -log interval=5"

stress_during_entire_upgrade:
  - "cassandra-stress write no-warmup cl=QUORUM n=300000 -schema 'keyspace=keyspace_during_upgrade replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=10 -pop seq=1..300000 -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5"
  - "cassandra-stress read cl=QUORUM duration=30m -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=10 -pop seq=1..100000 -col 'n=FIXED(10) size=FIXED(512)' -log interval=5"

stress_after_cluster_upgrade:
  - "cassandra-stress read cl=QUORUM n=100000 -schema 'keyspace=keyspace_entire_test replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=10 -pop seq=1..100000 -col 'n=FIXED(10) size=FIXED(512)' -log interval=5"
  - "cassandra-stress read cl=QUORUM n=300000 -schema 'keyspace=keyspace_during_upgrade replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=10 -pop seq=1..300000 -col 'n=FIXED(1) size=FIXED(1024)' -log interval=5"
