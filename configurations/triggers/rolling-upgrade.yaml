jenkinsfiles:
  - path: "jenkins-pipelines/oss/sct_triggers/rolling-upgrade-trigger.jenkinsfile"

# Rolling upgrade trigger matrix — single source of truth for all rolling-upgrade jobs.
#
# Replaces:
#   - jenkins-pipelines/master-triggers/sct_triggers/weekly-master-images-rolling-upgrades-trigger.xml
#
# Also serves as the target for scylla-pkg release triggers. When scylla-pkg builds
# packages/images for a release, it calls this trigger with explicit new_scylla_repo
# and/or image params.
#
# Usage patterns:
#   Weekly (cron):    scylla_version={branch}:latest, labels_selector=weekly,week-{a,b}
#   Release (manual): new_scylla_repo=<url>, scylla_version=<tag>
#   Image-based:      scylla_ami_id=<id>, backend=aws (or gce_image_db, azure_image_db)
#
# Biweekly alternation (SCT-716)
# ------------------------------
# Every "weekly" job also carries exactly one of "week-a" / "week-b", and the two cron
# lines below select one half each — so a job runs roughly every 2 weeks. The halves are
# balanced on estimated cost (`sct.py sizing preview`), ~$114 vs ~$120 per run.
#
# "weekly" on its own still selects the FULL set (labels are AND-matched), so the
# scylla-pkg release path is unaffected. The "release"-labelled jobs below are not
# cron-driven and deliberately carry no week label.
#
# The phase is deliberately OPPOSITE to tier1.yaml: tier1's heavy half (week-a) shares a
# weekend with rolling-upgrade's lighter half, spreading concurrent cloud usage.

cron_triggers:
  # 1st, 3rd and 5th Saturday of the month, 06:00 UTC.
  #
  # Cron has no "every 2 weeks" — there is no week-number field. The alternation is
  # a day-of-month window AND-ed with day-of-week, which works because Jenkins ANDs
  # those two fields (standard Vixie cron ORs them). Same idiom as
  # perf-regression.yaml's "13 6 8-14 * 2" == 2nd Tuesday of the month.
  # Days 29-31 are attached here so no Saturday is ever left idle.
  - schedule: "00 06 1-7,15-21,29-31 * 6"
    params:
      scylla_version: "{branch}:latest"
      labels_selector: "weekly,week-b"
      requested_by_user: "fruch"
  # 2nd and 4th Saturday of the month, 06:00 UTC.
  - schedule: "00 06 8-14,22-28 * 6"
    params:
      scylla_version: "{branch}:latest"
      labels_selector: "weekly,week-a"
      requested_by_user: "fruch"

defaults:
  provision_type: "on_demand"
  post_behavior_db_nodes: "destroy"
  post_behavior_loader_nodes: "destroy"
  post_behavior_monitor_nodes: "destroy"
  gce_project: "gcp-sct-project-1"
  rolling_upgrade_test: "true"
  new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

jobs:
  # ===========================================================================
  # RPM-based rolling upgrades
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-rocky10-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "rpm"
    exclude_versions: []
    params:
      region: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com/unstable/scylla/{branch}/rpm/centos/latest/scylla.repo"

  # ===========================================================================
  # DEB-based rolling upgrades
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-debian13-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-b"
      - "deb"
    exclude_versions: []
    params:
      region: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2404-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-b"
      - "deb"
    exclude_versions: []
    params:
      region: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2604-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "deb"
    exclude_versions: []
    params:
      region: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  # ===========================================================================
  # Image-based rolling upgrades (AMI / GCE / Azure)
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-ami-test"
    backend: "aws"
    labels:
      - "weekly"
      - "week-b"
      - "image"
      - "ami"
    exclude_versions: []
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ami-arm-test"
    backend: "aws"
    arch: "aarch64"
    labels:
      - "weekly"
      - "week-a"
      - "image"
      - "ami"
    exclude_versions: []
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-gce-image-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "image"
      - "gce"
    exclude_versions: []
