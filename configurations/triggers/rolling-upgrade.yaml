jenkinsfiles:
  - path: "jenkins-pipelines/oss/sct_triggers/rolling-upgrade-trigger.jenkinsfile"

# Rolling upgrade trigger matrix — single source of truth for all rolling-upgrade jobs.
#
# Replaces:
#   - jenkins-pipelines/master-triggers/sct_triggers/weekly-master-images-rolling-upgrades-trigger.xml
#
# Also serves as the target for scylla-pkg release triggers. When scylla-pkg builds
# packages/images for a release, it calls this trigger with explicit new_scylla_repo
# and/or image params.
#
# Usage patterns:
#   Weekly (cron):    scylla_version={branch}:latest, labels_selector=weekly,week-{a,b}
#   Minicloud (cron): scylla_version={branch}:latest, labels_selector=weekly-minicloud (SCT-1093)
#   Release (manual): new_scylla_repo=<url>, scylla_version=<tag>
#   Image-based:      scylla_ami_id=<id>, backend=aws (or gce_image_db, azure_image_db)
#
# Labels
# ------
# Two different kinds of "label" appear in this file - do not mix them up:
#
# Matrix labels (a job's `labels:` list) select which jobs a trigger run fires;
# `labels_selector` AND-matches them:
#   weekly            - part of the biweekly real-cloud cron (see below)
#   week-a / week-b   - which half of the biweekly alternation (see below)
#   release           - fired only by scylla-pkg release triggers, never by cron
#   rpm / deb / image - how the base version is installed
#   ami / gce / azure - which image an image-based job boots from
#   weekly-minicloud  - part of the every-Friday minicloud cron (SCT-1093, see below)
#
# Jenkins agent label (the `jenkins_label` job param) pins a build to specific Jenkins
# machines:
#   minicloud-kvm-builders-rolling-upgrades - the KVM lab machines minipc1-4, reserved for
#                                             the minicloud rolling upgrades (SCT-1093)
#
# Minicloud on master (SCT-1093)
# ------------------------------
# To save cloud cost, seven of the weekly jobs run on master against minicloud on the minipc
# lab machines, every Friday at noon, instead of in the biweekly real-cloud alternation.
# The change is purely additive and confined to master:
#   - each of the seven regular entries below is unchanged except for
#     `exclude_versions: ["master"]` (marked "SCT-1093"): everything that is not master -
#     scylla-pkg release calls included - selects and runs them exactly as before;
#   - the "Minicloud on master" block at the end of `jobs` holds their master-only minicloud
#     twins (same job names, `include_versions: ["master"]`), passing:
#       minicloud: "true"   - start the emulator and point SCT at it
#       local_agent: "true" - no sct-runner, the test runs on the Jenkins agent itself
#       jenkins_label       - minicloud-kvm-builders-rolling-upgrades (above)
#       test_config         - adds the minicloud overlays that shrink the run to one host
#   - the Friday `weekly-minicloud` cron line fires that block.
#
# To go back to biweekly real-cloud runs on master: delete the "Minicloud on master" block
# and the Friday cron line, and set the seven SCT-1093 `exclude_versions` back to `[]`.
# That alone restores the previous behaviour; the header comments that mention SCT-1093
# (this section, and the SCT-1093 lines in "Usage patterns", "Labels" and "Biweekly
# alternation") can then go too.

# Biweekly alternation (SCT-716)
# ------------------------------
# Every "weekly" job also carries exactly one of "week-a" / "week-b", and the two cron
# lines below select one half each — so a job runs roughly every 2 weeks. The halves are
# balanced on estimated cost (`sct.py sizing preview`), ~$114 vs ~$120 per run.
# While SCT-1093 is in place, master's halves are just rolling-upgrade-ami-arm (week-a) and
# rolling-upgrade-azure-image (week-b); the other seven run on minicloud (see above).
#
# "weekly" on its own still selects the FULL set (labels are AND-matched), so the
# scylla-pkg release path is unaffected. The "release"-labelled jobs below are not
# cron-driven and deliberately carry no week label.
#
# The phase is deliberately OPPOSITE to tier1.yaml: tier1's heavy half (week-a) shares a
# weekend with rolling-upgrade's lighter half, spreading concurrent cloud usage.

cron_triggers:
  # 1st, 3rd and 5th Saturday of the month, 06:00 UTC.
  #
  # Cron has no "every 2 weeks" — there is no week-number field. The alternation is
  # a day-of-month window AND-ed with day-of-week, which works because Jenkins ANDs
  # those two fields (standard Vixie cron ORs them). Same idiom as
  # perf-regression.yaml's "13 6 8-14 * 2" == 2nd Tuesday of the month.
  # Days 29-31 are attached here so no Saturday is ever left idle.
  - schedule: "00 06 1-7,15-21,29-31 * 6"
    params:
      scylla_version: "{branch}:latest"
      labels_selector: "weekly,week-b"
      requested_by_user: "fruch"
  # 2nd and 4th Saturday of the month, 06:00 UTC.
  - schedule: "00 06 8-14,22-28 * 6"
    params:
      scylla_version: "{branch}:latest"
      labels_selector: "weekly,week-a"
      requested_by_user: "fruch"
  # SCT-1093: every Friday, 12:00 UTC - the minicloud jobs on master, on the minipc lab
  # machines, which are otherwise idle at that time. Delete this line to revert.
  - schedule: "00 12 * * 5"
    params:
      scylla_version: "{branch}:latest"
      labels_selector: "weekly-minicloud"
      requested_by_user: "fruch"

defaults:
  provision_type: "on_demand"
  post_behavior_db_nodes: "destroy"
  post_behavior_loader_nodes: "destroy"
  post_behavior_monitor_nodes: "destroy"
  gce_project: "gcp-sct-project-1"
  rolling_upgrade_test: "true"
  new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

jobs:
  # ===========================================================================
  # RPM-based rolling upgrades
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-rocky10-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "rpm"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com/unstable/scylla/{branch}/rpm/centos/latest/scylla.repo"

  # ===========================================================================
  # DEB-based rolling upgrades
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-debian13-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-b"
      - "deb"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2404-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-b"
      - "deb"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2604-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "deb"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  # ===========================================================================
  # Image-based rolling upgrades (AMI / GCE / Azure)
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-ami-test"
    backend: "aws"
    labels:
      - "weekly"
      - "week-b"
      - "image"
      - "ami"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ami-arm-test"
    backend: "aws"
    arch: "aarch64"
    labels:
      - "weekly"
      - "week-a"
      - "image"
      - "ami"
    exclude_versions: []
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-gce-image-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-a"
      - "image"
      - "gce"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-azure-image-test"
    backend: "azure"
    labels:
      - "weekly"
      - "week-b"
      - "image"
      - "azure"
    exclude_versions: []
    params:
      region: "eastus"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  # ===========================================================================
  # Feature/scenario rolling upgrades
  # ===========================================================================

  - job_name: "rolling-upgrade/rolling-upgrade-alternator-test"
    backend: "gce"
    labels:
      - "weekly"
      - "week-b"
      - "deb"
    exclude_versions: ["master"]  # SCT-1093: on master it runs on minicloud, see the end of `jobs`
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  # --- Non-weekly jobs (triggered by scylla-pkg on release only) ---
  #
  # No debian-13 entry belongs here (SCT-943): a release (manual) trigger passes
  # no labels_selector (see "Usage patterns" above), so it already selects every
  # job in this file regardless of label — the weekly-labelled
  # rolling-upgrade-debian13-test entry above already covers the release path.
  # Adding a "release"-labelled twin here would be a byte-identical entry, not
  # additional coverage.

  # Moved to sizing_db (Graviton) on master only; release branches still run i4i.
  - job_name: "rolling-upgrade/rolling-upgrade-multidc-test"
    backend: "aws"
    arch: "x86_64"
    labels:
      - "release"
      - "deb"
    include_versions: ["2024", "2025", "2026.1", "2026.2", "2026.3"]
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-multidc-test"
    backend: "aws"
    arch: "aarch64"
    labels:
      - "release"
      - "deb"
    exclude_versions: ["2024", "2025", "2026.1", "2026.2", "2026.3"]
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-with-sla-test"
    backend: "gce"
    labels:
      - "release"
      - "deb"
    exclude_versions: []
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-with-sla-no-shares-test"
    backend: "gce"
    labels:
      - "release"
      - "deb"
    exclude_versions: []
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-with-null-inserts-test"
    backend: "gce"
    labels:
      - "release"
      - "deb"
    exclude_versions: []
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-with-enable-tablets-test"
    backend: "gce"
    labels:
      - "release"
      - "image"
      - "gce"
    exclude_versions: []
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu22.04-ldap-authorization-test"
    backend: "gce"
    labels:
      - "release"
      - "deb"
    exclude_versions: []
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  # ===========================================================================
  # Minicloud on master (SCT-1093) - delete this whole block to revert
  # ===========================================================================
  #
  # Master-only twins of seven entries above (which exclude master). The distro and stock
  # image still come from each job's jenkinsfile; test_config adds the minicloud overlays.

  - job_name: "rolling-upgrade/rolling-upgrade-rocky10-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "rpm"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com/unstable/scylla/{branch}/rpm/centos/latest/scylla.repo"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/generic-rolling-upgrade.yaml", "configurations/minicloud/generic-rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-debian13-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "deb"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/generic-rolling-upgrade.yaml", "configurations/minicloud/generic-rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2404-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "deb"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/generic-rolling-upgrade.yaml", "configurations/minicloud/generic-rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-ubuntu2604-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "deb"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/generic-rolling-upgrade.yaml", "configurations/minicloud/generic-rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-ami-test"
    backend: "aws"
    labels:
      - "weekly-minicloud"
      - "image"
      - "ami"
    include_versions: ["master"]
    params:
      region: "eu-west-1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/rolling-upgrade.yaml", "configurations/minicloud/rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-gce-image-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "image"
      - "gce"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/rolling-upgrade.yaml", "configurations/minicloud/rolling-upgrade.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'

  - job_name: "rolling-upgrade/rolling-upgrade-alternator-test"
    backend: "gce"
    labels:
      - "weekly-minicloud"
      - "deb"
    include_versions: ["master"]
    params:
      gce_datacenter: "us-east1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"
      minicloud: "true"
      local_agent: "true"
      jenkins_label: "minicloud-kvm-builders-rolling-upgrades"
      test_config: '["test-cases/upgrades/generic-rolling-upgrade.yaml", "configurations/rolling-upgrade-alternator.yaml", "configurations/minicloud/generic-rolling-upgrade.yaml", "configurations/minicloud/rolling-upgrade-alternator.yaml", "configurations/auth_cassandra.yaml", "configurations/minicloud.yaml"]'
