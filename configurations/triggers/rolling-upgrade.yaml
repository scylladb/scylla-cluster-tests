      region: "us-central1"
      new_scylla_repo: "http://downloads.scylladb.com.s3.amazonaws.com/unstable/scylla/{branch}/deb/unified/latest/scylladb-{branch}/scylla.list"

  - job_name: "rolling-upgrade/rolling-upgrade-azure-image-test"
    backend: "azure"
    labels:
      - "weekly"
      - "week-b"
      - "image"
      - "azure"
    exclude_versions: []
