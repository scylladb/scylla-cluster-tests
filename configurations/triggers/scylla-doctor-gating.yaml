jenkinsfiles:
  - path: "jenkins-pipelines/oss/sct_triggers/scylla-doctor-gating-trigger.jenkinsfile"

# Scylla-doctor gating trigger — runs artifacts tests with full doctor edition,
# waits for completion, and collects analysis results.
#
# This is a gating trigger: if scylla-doctor analysis finds critical issues,
# the trigger pipeline fails, blocking downstream release gates.
#
# Jobs use absolute paths (scylla-doctor/oss/artifacts/...) since they live
# under the scylla-doctor top-level folder, not under scylla-{branch}/.
#
# All jobs run in doctor-only mode (run_scylla_doctor_only), with the full edition.
#
# Optional trigger parameter: scylla_doctor_full_tarball_url
#   Tests an unreleased Scylla Doctor build. It is passed to every job. Set it in
#   Jenkins "Build with Parameters", or with `sct.py trigger-matrix
#   --scylla-doctor-full-tarball-url <url>`. Accepts any S3 URL form that
#   utils/scylla_doctor.py:_parse_s3_url understands, for example:
#     https://s3.amazonaws.com/<bucket>/<key>/scylla-doctor-1.11.4.tar.gz
#     https://<bucket>.s3.<region>.amazonaws.com/<key>/scylla-doctor-1.11.4.tar.gz
#   It has no default on purpose. When empty, the job finds the latest released
#   full edition by itself, and a fixed URL here would pin one build.

defaults:
  provision_type: "on_demand"
  post_behavior_db_nodes: "destroy"
  post_behavior_loader_nodes: "destroy"
  post_behavior_monitor_nodes: "destroy"
  scylla_doctor_edition: "full"
  run_scylla_doctor_only: "true"

jobs:
  - job_name: "/scylla-doctor/oss/artifacts/artifacts-ami-test"
    backend: "aws"
    wait: true
    wait_timeout: 7200
    fail_on_error: true
    collect_results:
      - "scylla_doctor_*_analysis.json"
    labels:
      - "gating"
    params:
      region: "eu-west-1"
      scylla_doctor_edition: "full"

  - job_name: "/scylla-doctor/oss/artifacts/artifacts-ami-arm-test"
    backend: "aws"
    arch: "aarch64"
    wait: true
    wait_timeout: 7200
    fail_on_error: true
    collect_results:
      - "scylla_doctor_*_analysis.json"
    labels:
      - "gating"
    params:
      region: "eu-west-1"
      scylla_doctor_edition: "full"

  - job_name: "/scylla-doctor/oss/artifacts/artifacts-docker-test"
    backend: "aws"
    wait: true
    wait_timeout: 3600
    fail_on_error: true
    collect_results:
      - "scylla_doctor_*_analysis.json"
    labels:
      - "gating"
    params:
      region: "eu-west-1"
      scylla_doctor_edition: "full"

email_recipients: "qa@scylladb.com"
