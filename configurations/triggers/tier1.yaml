jenkinsfiles:
  - path: "jenkins-pipelines/master-triggers/sct_triggers/tier1-custom-time-trigger.jenkinsfile"

# Tier1 trigger matrix — single source of truth for all tier1 job definitions.
#
# Replaces:
#   - jenkins-pipelines/master-triggers/sct_triggers/tier1-custom-time-trigger.xml
#   - jenkins-pipelines/oss/sct_triggers/tier1-aws-custom-time-trigger.xml
#   - jenkins-pipelines/oss/sct_triggers/tier1-azure-custom-time-trigger.xml
#   - jenkins-pipelines/oss/sct_triggers/tier1-gce-custom-time-trigger.xml
#   - jenkins-pipelines/oss/sct_triggers/tier1-aws-aarch64-custom-time-trigger.xml
#
# Related PRs that move tier1 jobs between backends (must align after merge):
#   - #14594: replace Azure 1TB 5-day test with AWS i8g alternative
#
# Biweekly alternation (SCT-716)
# ------------------------------
# Every job keeps its "weekly" label and additionally carries exactly one of
# "week-a" / "week-b". The two cron lines below select one half each, so a job
# runs roughly every 2 weeks instead of every week. The halves are balanced on
# estimated cost (`sct.py sizing preview`), ~$970 vs ~$966 per run.
#
# "weekly" on its own still selects the FULL set — labels are AND-matched, so
# release / scylla-pkg triggers passing labels_selector=weekly are unaffected.
#
# NOTE: an entry's arch must be the arch the job's own config resolves to on that
# release's SCT branch. Downstream jobs get only scylla_version, so the matrix arch
# cannot change it; it only decides which per-arch release run (x86 or ARM AMI)
# triggers the job and which images resolve its version. When branches differ,
# split the entry by version range: the open-ended entry follows master (new
# branches inherit it), the other lists the older branches. Two arches whose
# version ranges overlap fire the job twice (SCT-1168) and fail validation.

# Tier1 jobs are independent of each other, so every backend runs its own latest build
# rather than waiting for one build to be published everywhere. This is the default, spelled
# out here because handing GCE an AWS-only build is what SCT-665 was.
version_resolution: "per-backend"

cron_triggers:
  # 1st, 3rd and 5th Saturday of the month, 06:00 UTC.
  #
  # Cron has no "every 2 weeks" — there is no week-number field. The alternation is
  # a day-of-month window AND-ed with day-of-week, which works because Jenkins ANDs
  # those two fields (standard Vixie cron ORs them). Same idiom as
  # perf-regression.yaml's "13 6 8-14 * 2" == 2nd Tuesday of the month.
  # Days 29-31 are attached here so no Saturday is ever left idle.
  - schedule: "00 06 1-7,15-21,29-31 * 6"
    params:
      scylla_version: "{branch}:latest"
      job_folder: "scylla-master"
      labels_selector: "weekly,week-a"
      requested_by_user: "pehala"
  # 2nd and 4th Saturday of the month, 06:00 UTC.
  - schedule: "00 06 8-14,22-28 * 6"
    params:
      scylla_version: "{branch}:latest"
      job_folder: "scylla-master"
      labels_selector: "weekly,week-b"
      requested_by_user: "pehala"

defaults:
  provision_type: "on_demand"
  post_behavior_db_nodes: "destroy"
  post_behavior_loader_nodes: "destroy"
  post_behavior_monitor_nodes: "destroy"
  stress_duration: "1440"
  availability_zone: "c"

jobs:
  # ==================== AWS x86 ====================

  - job_name: "tier1/gemini-1tb-10h-test"
    backend: "aws"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-b"
    exclude_versions: ["2024.1", "2025.1", "2025.4", "2026.1"]

  # Moved to sizing_db (Graviton) in 2026.2; older branches still run i4i.
  - job_name: "tier1/longevity-mv-si-4days-streaming-test"
    backend: "aws"
    arch: "x86_64"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-a"
    include_versions: ["2024", "2025", "2026.1"]

  - job_name: "tier1/longevity-mv-si-4days-streaming-test"
    backend: "aws"
    arch: "aarch64"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-a"
    exclude_versions: ["2024", "2025", "2026.1"]

  # Moved to sizing_db (Graviton) in 2026.2; older branches still run i4i.
  - job_name: "tier1/longevity-schema-topology-changes-12h-test"
    backend: "aws"
    arch: "x86_64"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-a"
    include_versions: ["2024", "2025", "2026.1"]

  - job_name: "tier1/longevity-schema-topology-changes-12h-test"
    backend: "aws"
    arch: "aarch64"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-a"
    exclude_versions: ["2024", "2025", "2026.1"]

  - job_name: "tier1/scale-schema-5000-tables-latte-test"
    backend: "aws"
    arch: "aarch64"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-b"
    exclude_versions: ["2024.1", "2025.1", "2025.4", "2026.1"]

  - job_name: "tier1/longevity-50gb-3days-test"
    backend: "aws"
    params:
      region: "eu-west-1"
      availability_zone: "a,b,c"
    labels:
      - "weekly"
      - "week-a"
    include_versions: ["2024.1", "2025.1", "2025.4", "2026.1"]

  - job_name: "tier1/longevity-multidc-schema-topology-changes-12h-test"
    backend: "aws"
    params:
      region: '["eu-west-1", "eu-west-2"]'
      availability_zone: "a,b,c"
    labels:
      - "weekly"
      - "week-b"

  # ==================== AWS aarch64 ====================

  - job_name: "tier1/longevity-twcs-48h-test"
    backend: "aws"
    params:
      region: "us-east-1"
    labels:
      - "weekly"
      - "week-b"
      - "aarch64"
    exclude_versions: ["2024.1", "2025.1"]

  - job_name: "tier1/longevity-2tb-5days-test"
    backend: "aws"
    params:
      region: "eu-west-1"
    labels:
      - "weekly"
      - "week-b"
      - "aarch64"
    exclude_versions: ["2024.1", "2025.1", "2025.4", "2026.1", "2026.2"]

  - job_name: "tier1/elasticity-90-percent-with-nemesis-test"
    backend: "aws"
    params:
      region: "us-east-1"
    labels:
      - "weekly"
      - "week-a"
      - "aarch64"
    exclude_versions: ["2024.1", "2025.1", "2025.4", "2026.1"]

  # ==================== GCE ====================

  - job_name: "tier1/longevity-asymmetric-cluster-12h-test"
    backend: "gce"
    params:
      gce_datacenter: "us-east1"
      availability_zone: ""
    labels:
      - "weekly"
      - "week-b"

  - job_name: "tier1/longevity-large-partition-200k-pks-4days-gce-test"
    backend: "gce"
    params:
      gce_datacenter: "us-east1"
      availability_zone: ""
    labels:
      - "weekly"
      - "week-a"

  # ==================== Azure ====================

  - job_name: "tier1/longevity-1tb-5days-azure-test"
    backend: "azure"
    params:
      azure_region_name: "eastus"
      availability_zone: ""
    labels:
      - "weekly"
      - "week-b"
    include_versions: ["2024.1", "2025.1", "2025.4", "2026.1", "2026.2"]
