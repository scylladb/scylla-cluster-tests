# LWT Light Vnodes - predefined throughput steps: gradual-load config + latency thresholds

perf_gradual_threads: {"read": 468, "write": 468, "mixed": 468}
perf_gradual_throttle_steps: {"read": ['267000'], "write": ['23000'], "mixed": ['42000']}
perf_gradual_step_duration: {"read": '30m', "write": '30m', "mixed": '30m'}

# P99 calibrated from vnodes' own measured latency (Jenkins lwt-light-vnodes #29, 2026-08-08),
# +25% margin for run-to-run variance.
latency_decorator_error_thresholds:
  write:
    default:
      P90 write:
        fixed_limit: null
      P99 write:
        fixed_limit: 14.93
      Throughput write:
        fixed_limit: 22500

  read:
    default:
      P90 read:
        fixed_limit: null
      P99 read:
        fixed_limit: 9998.18
      Throughput read:
        fixed_limit: 254000

  mixed:
    default:
      P90 write:
        fixed_limit: null
      P90 read:
        fixed_limit: null
      P99 write:
        fixed_limit: 12.44
      P99 read:
        fixed_limit: 3.69
      Throughput write:
        fixed_limit: 20000
