# Run the latency-with-nemesis test on i8g with the same dataset, commands and loaders as the
# predefined throughput steps test (test-cases/performance/perf-regression-predefined-throughput-steps.yaml
# with configurations/performance/cassandra_stress_gradual_load_steps_i8g.yaml), at 60% of its max throughput.
#
# The max throughput is not exact between runs, so the rates start from the max on 2026.4.0-rc3
# (scylla-enterprise-perf-regression-predefined-throughput-steps-i8g-tablets #145) minus the accepted
# 4% flakiness, rounded down, and take 60% of that, rounded down:
#   read           1,427,167 ops/s -> 1,370K -> 60% = 822K -> fixed=205500/s per loader, 620 threads
#   write            645,402 ops/s ->   619K -> 60% = 371K -> fixed=92750/s per loader, 400 threads
#   mixed            895,886 ops/s ->   860K -> 60% = 516K -> fixed=129000/s per loader, 1900 threads
#   read_disk_only   577,124 ops/s ->   554K -> 60% = 332K -> fixed=83000/s per loader, 620 threads
#
# Each list has one command per loader (round_robin), as in the steps test.
# Differences from the steps test, needed by the nemesis test:
#   - The commands run for a fixed duration (the load stops when the nemesis sequence ends), so the
#     write commands use duration= instead of n=, over the same key ranges.
#   - The write test runs on top of the preloaded dataset, because the nemesis operations need data.
#     Its key ranges are the steps test ones and go past the preload (1.61B keys against 650M),
#     so it overwrites the preloaded keys and also adds new ones.
#   - No cache warm-up step: the test runs the load for one nemesis_interval before the first nemesis.

prepare_write_cmd: [
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=50 throttle=37500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=1..162500001",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=50 throttle=37500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=162500002..325000002",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=50 throttle=37500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=325000003..487500003",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=50 throttle=37500/s -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=487500004..650000004"
]

stress_cmd_w: [
  "cassandra-stress write cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate 'threads=400 fixed=92750/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..402653184",
  "cassandra-stress write cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate 'threads=400 fixed=92750/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=402653185..805306368",
  "cassandra-stress write cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate 'threads=400 fixed=92750/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=805306369..1207959552",
  "cassandra-stress write cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate 'threads=400 fixed=92750/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1207959553..1610612736"
]

stress_cmd_r: [
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=205500/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..5000000",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=205500/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=5000001..10000000",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=205500/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000001..15000000",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=205500/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=15000001..20000000"
]

stress_cmd_m: [
  "cassandra-stress mixed  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=1900 fixed=129000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..5000000",
  "cassandra-stress mixed  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=1900 fixed=129000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=5000001..10000000",
  "cassandra-stress mixed  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=1900 fixed=129000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=10000001..15000000",
  "cassandra-stress mixed  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=1900 fixed=129000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=15000001..20000000"
]

# Reads keys from the whole dataset, so the reads go to disk
stress_cmd_read_disk: [
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=83000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..162500001",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=83000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=162500002..325000002",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=83000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=325000003..487500003",
  "cassandra-stress read  cl=QUORUM duration=800m -mode connectionsPerHost=8 cql3 native -rate 'threads=620 fixed=83000/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=487500004..650000004"
]

# Same as configurations/disable_speculative_retry.yaml in the steps job, limited to the table this test
# creates: preload_data runs every command, and the other tables don't exist here.
post_prepare_cql_cmds: ["ALTER TABLE keyspace1.standard1 WITH speculative_retry = 'NONE'"]

n_loaders: 4
instance_type_loader: 'c7i.8xlarge'
