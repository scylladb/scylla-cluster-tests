experimental_features:
  - logstor

append_scylla_yaml:
  logstor_disk_size_in_mb: 80000
  logstor_format_on_startup: true
  force_capacity_based_balancing: true

# The ++ prefix appends these flags to the append_scylla_args of the test-case, so the flags of
# the test-case stay in place.
#
# --task-quota-ms 0.2 keeps the task batches of a shard short, so that queued reads wait less
# time for the dispatch of their I/O.
#
# --io-latency-goal-ms 1.0 sets the I/O latency goal explicitly. The Seastar default is
# 1.5 x task-quota-ms, which is 0.3 ms here. Each shard can reserve I/O tokens for only
# goal / shard count per round, so at 0.3 ms one 128 KiB logstor compaction read needs
# several rounds, and the shard dispatches no other I/O, foreground reads included, until the
# read has its tokens. At 1.0 ms the read gets its tokens in one round.
append_scylla_args: '++ --task-quota-ms 0.2 --io-latency-goal-ms 1.0'

n_db_nodes: 4
n_loaders: 1
# Nodes used to replicate the Aerospike test to be able to compare the results
instance_type_db: 'i4i.4xlarge'
instance_type_loader: 'c6i.16xlarge'

simulated_racks: 2
rack_aware_loader: true
